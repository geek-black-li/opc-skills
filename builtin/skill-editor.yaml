schema_version: "1.0"
id: skill-editor
name: "编辑 Skill"
version: "3.0.1"
description: "读取并修改 OPCSkills 仓库中的已有 Skill，在保留兼容性和来源边界的前提下更新内容、版本与验证结果。"
category: system
origin: builtin
status: active

triggers:
  intents:
    - "修改已有 Skill"
    - "优化现有 Skill"
    - "根据 self-improve 建议增补 Skill"
  keywords:
    - skill-editor
    - 修改skill
    - 优化skill
    - 更新skill

input_schema:
  type: object
  properties:
    repository_root:
      type: string
      description: "OPCSkills 仓库根目录；未提供时从当前路径向上查找 skill-manifest.yaml。"
    invocation_source:
      type: string
      enum:
        - direct
        - self-improve
      default: direct
      description: "direct 表示用户直接要求修改；self-improve 表示由沉淀提案继续执行，必须校验确认对象。"
    self_improve_confirmation:
      type: object
      description: "invocation_source=self-improve 时必填，绑定用户确认的 Self-Improve 提案。"
      properties:
        confirmed:
          const: true
        proposal_id:
          type: string
          pattern: "^zxsi-[a-f0-9]{16}$"
        action:
          const: update-skill
      required:
        - confirmed
        - proposal_id
        - action
      additionalProperties: false
    target:
      type: string
      description: "待修改 Skill 的唯一 id 或仓库相对路径。"
    change_request:
      type: string
      description: "需要修改的原因、目标和验收条件。"
    proposed_changes:
      type: array
      description: "可选的具体修改点，通常来自 skill-selfimprove。"
      items:
        type: string
    expected_version_bump:
      type: string
      description: "可选的版本调整级别。"
      enum:
        - patch
        - minor
        - major
    allow_builtin_edit:
      type: boolean
      description: "是否明确授权修改 builtin；默认 false。"
      default: false
    external_strategy:
      type: string
      description: "目标为第三方 Skill 时的处理方式。"
      enum:
        - preserve-wrapper-only
        - fork-to-custom
      default: preserve-wrapper-only
    new_category:
      type: object
      description: "仅当 fork-to-custom 且现有分类均不匹配时使用的扩展分类方案；字段遵循 category_extension。"
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        skill_token:
          type: string
          description: "用于 custom Skill id 分类段的一个小写通俗单词，必须全仓库唯一。"
          pattern: "^[a-z0-9]+$"
        name:
          type: string
        scope:
          type: string
        includes:
          type: array
          items:
            type: string
        excludes:
          type: array
          items:
            type: string
        rationale:
          type: string
      required:
        - slug
        - skill_token
        - name
        - scope
        - includes
        - excludes
        - rationale
      additionalProperties: false
  required:
    - target
    - change_request
  additionalProperties: false

output_schema:
  type: object
  properties:
    result:
      type: string
      enum:
        - updated
        - needs-input
        - not-found
        - protected
        - blocked
        - validation-failed
    original_path:
      type: string
    updated_path:
      type: string
    version_before:
      type: string
    version_after:
      type: string
    changes:
      type: array
      items:
        type: string
    validation:
      type: array
      items:
        type: string
    next_actions:
      type: array
      items:
        type: string
  required:
    - result
    - changes
    - validation
    - next_actions
  additionalProperties: false

constraints:
  - "先解析目标当前内容，再实施最小范围修改；不得用空模板覆盖已有 Skill。"
  - "默认不得修改 builtin；只有 allow_builtin_edit=true 的明确授权才允许。"
  - "不得修改 skills-temp-inbox；暂存 Skill 应交由 skill-import-external 处理。"
  - "不得直接改写 skills-external 下的第三方 source 原件。"
  - "若第三方改动会改变核心行为，必须 fork 到 skills-custom，并保留来源与修改说明。"
  - "任何新建或 fork-to-custom 的 Skill id 必须使用 zx-<category>-<function>，分类段匹配 skill_token，功能段最多两个通俗单词。"
  - "不得静默改变 id、category、origin 或许可信息。"
  - "不得覆盖与本次变更无关的用户修改。"
  - "invocation_source=self-improve 时，没有匹配 proposal_id 的明确确认不得修改或 fork Skill。"
  - "用户直接明确要求修改 Skill 时可使用 invocation_source=direct，不强制经过 Self-Improve。"

prompt: |-
  你是 OPCSkills 仓库的 Skill 编辑器。对已有 Skill 做可追溯、最小且兼容的修改。

  执行流程：
  1. 写入前先校验调用来源：
     - invocation_source=direct：用户当前明确要求修改目标 Skill，可继续常规流程。
     - invocation_source=self-improve：必须提供 self_improve_confirmation，且 confirmed=true、
       action=update-skill。用 target、change_request、proposed_changes、expected_version_bump 以及存在时的
       external_strategy 组成 parameters；将 {"conclusion":"update-skill","parameters":parameters}
       按键名递归升序、数组保持顺序、UTF-8 且无多余空白序列化为 canonical JSON，计算 SHA-256，取前
       16 位小写十六进制并加 zxsi- 前缀，重新计算 proposal_id。优先使用
       `scripts/compute-proposal-id.py --prefix zxsi-`；手工实现时哈希输入必须是无末尾换行的 canonical
       JSON UTF-8 字节。缺少确认、action 错误或确认不匹配时
       返回 blocked，且不得修改、fork、创建分类或写入任何文件。不能沿用另一份提案或变更后的参数。
  2. 定位仓库并读取 skill-manifest.yaml。用 target 精确查找可加载 Skill；若 id 命中多个文件，
     视为仓库冲突并返回 validation-failed，不自行选择。
  3. 读取完整目标文件、同目录资源和版本信息；确认 change_request 与当前行为的差距。
  4. 应用保护规则：
     - builtin：allow_builtin_edit 不为 true 时返回 protected。
     - external：source/ 下原件永久只读。仅元数据、触发词或适配问题可按
       preserve-wrapper-only 修改 skill.yaml 适配入口；任何核心行为改造都按 fork-to-custom
       创建新的 custom Skill。优先使用相同或其他已有分类；确实不匹配且提供完整 new_category
       时，按 manifest.category_extension 与 mirrored_roots 执行和 creator 相同的原子化分类注册，
       再使用符合 manifest.validation.custom_skill_id_pattern 的新 id，记录原始来源。新 id 必须
       使用 `zx-<category>-<function>`，category 段等于目标分类的 skill_token；功能段优先一个
       通俗单词、最多两个。new_category 同时注册唯一的 skill_token。
     - custom：在原文件上做最小修改；现有 id 必须符合 custom_skill_id_pattern。发现不符合时
       返回 validation-failed 并建议显式迁移，不得在普通内容更新中静默改名。
     - temp-inbox：返回 protected，并提示调用 skill-import-external。
  5. 在不削弱既有安全约束的前提下更新 description、triggers、schema、constraints、prompt
     或资源引用。保持所有相对路径有效。
  6. 按语义化版本更新 version：兼容修正为 patch，向后兼容能力增加为 minor，不兼容契约变更
     为 major。若用户提供 expected_version_bump 且与实际不符，返回 needs-input 说明冲突。
  7. 解析全部改动后的 YAML，检查 manifest 必填字段、id 唯一性、custom 的
     custom_skill_id_pattern、路径分类、引用资源、残留占位符以及原有触发场景是否仍可处理。
     若 fork 时新建分类，还要校验 manifest 注册、两侧 _readme.md 与 category-readme-template.md
     完整替换。任何一步失败时回滚本次新增分类项、mirrored_roots 目录和 fork 文件，不删除已有
     用户内容；返回 validation-failed 并说明回滚结果。
  8. 严格按 output_schema 返回原路径、最终路径、版本变化、修改点、验证证据与后续事项。

  编辑原则：优先修正明确问题；不顺手重写无关章节；不把个别项目的偶然做法升级为所有项目
  的强制规则；第三方深度改造必须进入 custom，不能伪装成原版 external。

metadata:
  author: OPCSkills
  tags:
    - builtin
    - skill-maintenance
    - repository-management
