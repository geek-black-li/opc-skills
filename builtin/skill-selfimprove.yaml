schema_version: "1.0"
id: skill-selfimprove
name: "Skill 自我提炼分析"
version: "1.0.0"
description: "在一个功能、需求、方案、测试或发布节点完成后，比较本次过程与 ZXSkills 现有能力，判断无需提炼、新建 Skill 或优化已有 Skill。"
category: system
origin: builtin
status: active

triggers:
  intents:
    - "评估刚完成的工作是否值得沉淀"
    - "功能节点结束后做 Skill 自优化分析"
    - "把项目经验转为可复用能力建议"
  keywords:
    - skill-selfimprove
    - self-improve
    - 自我提炼
    - skill沉淀评估

input_schema:
  type: object
  properties:
    repository_root:
      type: string
      description: "ZXSkills 仓库根目录；未提供时从已知配置或当前路径定位。"
    project_context:
      type: string
      description: "刚完成的项目节点、目标、约束和结果。"
    process_summary:
      type: string
      description: "实际执行步骤、关键判断、失败与修正过程。"
    artifacts:
      type: array
      description: "可供分析的需求、代码、设计、测试、日志或报告路径。"
      items:
        type: string
    validation_evidence:
      type: array
      description: "验证命令、测试结果、用户反馈或交付证据。"
      items:
        type: string
    auto_triggered:
      type: boolean
      description: "是否由功能节点完成事件自动触发。"
      default: false
  required:
    - project_context
    - process_summary
  additionalProperties: false

output_schema:
  type: object
  oneOf:
    - title: "无需提炼"
      properties:
        conclusion:
          const: no-action
        rationale:
          type: string
        evidence:
          type: array
          items:
            type: string
        reusable_boundary:
          type: string
      required:
        - conclusion
        - rationale
        - evidence
        - reusable_boundary
      additionalProperties: false

    - title: "建议新建 Skill"
      properties:
        conclusion:
          const: create-skill
        rationale:
          type: string
        evidence:
          type: array
          items:
            type: string
        creator_parameters:
          type: object
          properties:
            category:
              type: string
              enum:
                - 01-product
                - 02-ui-design
                - 03-fullstack-arch-dev
                - 04-test-quality
                - 05-ops-release
                - 06-project-manage
            skill_id:
              type: string
            name:
              type: string
            description:
              type: string
            triggers:
              type: object
            goal:
              type: string
            workflow:
              type: array
              items:
                type: string
            quality_criteria:
              type: array
              items:
                type: string
            input_schema:
              type: object
            output_schema:
              type: object
            constraints:
              type: array
              items:
                type: string
          required:
            - category
            - skill_id
            - name
            - description
            - triggers
            - goal
            - workflow
            - quality_criteria
            - input_schema
            - output_schema
            - constraints
          additionalProperties: false
      required:
        - conclusion
        - rationale
        - evidence
        - creator_parameters
      additionalProperties: false

    - title: "建议优化已有 Skill"
      properties:
        conclusion:
          const: update-skill
        rationale:
          type: string
        evidence:
          type: array
          items:
            type: string
        editor_parameters:
          type: object
          properties:
            target:
              type: string
            change_request:
              type: string
            proposed_changes:
              type: array
              items:
                type: string
            expected_version_bump:
              type: string
              enum:
                - patch
                - minor
                - major
            external_strategy:
              type: string
              enum:
                - preserve-wrapper-only
                - fork-to-custom
          required:
            - target
            - change_request
            - proposed_changes
            - expected_version_bump
          additionalProperties: false
      required:
        - conclusion
        - rationale
        - evidence
        - editor_parameters
      additionalProperties: false

constraints:
  - "只做读取、比较和评估，不创建、修改、移动或删除任何仓库文件。"
  - "固定且只能返回 no-action、create-skill、update-skill 三种结论之一。"
  - "不能因一次项目成功就默认建议沉淀；必须证明跨项目复用价值。"
  - "不得读取或加载 skills-temp-inbox 中未评估内容作为正式能力基线。"
  - "输出参数必须可直接作为 skill-creator 或 skill-editor 的输入，不使用未定、待补充等占位表述。"
  - "证据不足时选择 no-action，并在 rationale 中说明需要积累何种证据。"

prompt: |-
  你是 ZXSkills 的 Self-Improve 分析器。你的职责是把刚完成的项目过程与正式 Skill 仓库比较，
  给出一次可执行的沉淀决策。你只分析，不修改任何文件。

  分析流程：
  1. 读取 project_context、process_summary、artifacts 和 validation_evidence，提取：解决的问题、
     可重复输入、稳定步骤、关键决策、边界条件、失败模式、验证方法与产出格式。
  2. 定位仓库，读取 skill-manifest.yaml；只按 manifest 的 builtin、external、custom 扫描规则
     检索现有 Skill。明确排除 skills-temp-inbox、模板、说明文件和第三方 source 原件。
  3. 在六个业务分类中判断主要归属。跨域流程选择对最终交付结果负责的主分类，并把其他领域
     作为 triggers、workflow 或 constraints 的上下文，不复制出多个重叠 Skill。
  4. 按以下标准评估复用性：
     - 是否在不同项目中会以相似输入、步骤和输出重复出现；
     - 是否包含容易遗忘但会显著影响质量、安全或效率的判断；
     - 是否能脱离本项目专有名称、数据和临时环境后仍成立；
     - 是否已有 Skill 覆盖，差异究竟是缺陷、兼容扩展还是完全不同的能力；
     - 是否有实际产物或验证证据支持，而非仅有设想。
  5. 使用唯一决策规则：
     - no-action：项目独有、证据不足、价值过小，或现有 Skill 已充分覆盖；
     - create-skill：存在明确、独立、跨项目复用的能力，且没有合适的现有 Skill；
     - update-skill：现有 Skill 已覆盖主要意图，但缺少本次证实有效的步骤、约束、触发词、
       失败处理或验证标准。
  6. 输出必须严格匹配 output_schema 的一个且仅一个分支：
     - no-action：提供 conclusion、rationale、evidence、reusable_boundary；
     - create-skill：提供 conclusion、rationale、evidence、creator_parameters。creator_parameters
       必须完整包含 category、skill_id、name、description、triggers、goal、workflow、
       quality_criteria、input_schema、output_schema、constraints，可直接传给 skill-creator；
     - update-skill：提供 conclusion、rationale、evidence、editor_parameters。editor_parameters
       必须完整包含 target、change_request、proposed_changes、expected_version_bump；目标为
       external 时还必须提供 external_strategy，可直接传给 skill-editor。
  7. 不要输出多个候选结论，不要让用户二次整理参数，不要直接调用 creator/editor。

  参数质量要求：skill_id 使用小写横杠格式；description 和 triggers 是可检索的真实触发场景；
  workflow 是可以执行的有序步骤；quality_criteria 可验证；schema 字段完整；constraints 保留
  权限、数据安全、第三方来源和用户工作区边界。

metadata:
  author: ZXSkills
  tags:
    - builtin
    - self-improve
    - knowledge-capture
