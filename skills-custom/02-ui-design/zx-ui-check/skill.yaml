schema_version: "1.0"
id: zx-ui-check
name: "ZX UI 页面检查"
version: "1.2.0"
description: "当需要按照项目 UI 规范，逐页检查 Web 页面或原型的视觉、布局、状态、交互和无障碍问题，并输出带截图和严重级别的问题清单时使用。"
category: 02-ui-design
origin: custom
status: active

triggers:
  intents:
    - "按照 UI 设计规范审查当前项目全部页面"
    - "列出不符合设计规范的页面和具体问题"
    - "发布前对静态页面执行逐路由视觉验收"
    - "检查主题、浮层、键盘与页面状态是否符合规范"
    - "检查流程图或节点画布的缩放、端口菜单和上下文新增节点"
  keywords:
    - "UI页面检查"
    - "检查UI页面"
    - "页面规范检查"
    - "逐页视觉审查"
    - "静态页面验收"
    - "画布交互检查"
    - "节点画布验收"
    - "端口菜单检查"
    - "zx-ui-check"

input_schema:
  type: object
  properties:
    project_root:
      type: string
      description: "待审查项目根目录。"
    spec_document:
      type: string
      description: "作为权威依据的 UI 设计规范路径。"
    device_scope:
      type: string
      description: "目标设备、视口与不在范围内的设备说明。"
    routes:
      type: array
      items:
        type: string
      description: "可选；明确指定的页面路由。省略时从项目路由盘点全部页面。"
    build_command:
      type: string
      description: "可选；项目认可的构建命令。"
    preview_command:
      type: string
      description: "可选；项目认可的本地预览命令。"
    test_command:
      type: string
      description: "可选；与审查基线相关的测试命令。"
    theme_scope:
      type: array
      items:
        type: string
      description: "需要核验的主题，例如 light、dark。"
    audit_depth:
      type: string
      enum:
        - standard
        - deep
      default: deep
  required:
    - project_root
    - spec_document
    - device_scope
  additionalProperties: false

output_schema:
  type: object
  properties:
    result:
      type: string
      enum:
        - audited
        - blocked
    scope_summary:
      type: string
    compliant_count:
      type: integer
      minimum: 0
    noncompliant_count:
      type: integer
      minimum: 0
    global_findings:
      type: array
      items:
        type: object
    page_findings:
      type: array
      items:
        type: object
    positive_findings:
      type: array
      items:
        type: string
    validation_evidence:
      type: array
      items:
        type: string
    evidence_limitations:
      type: array
      items:
        type: string
    next_actions:
      type: array
      items:
        type: string
  required:
    - result
    - scope_summary
    - compliant_count
    - noncompliant_count
    - global_findings
    - page_findings
    - positive_findings
    - validation_evidence
    - evidence_limitations
    - next_actions
  additionalProperties: false

constraints:
  - "默认只读审查；没有单独授权时不得修复页面、修改规范、提交、推送、部署或发布。"
  - "只把用户指定或项目声明的权威规范作为合规依据，不把个人审美偏好写成硬性违规。"
  - "不得信任未知来源的常驻预览；必须确认页面来自当前目标工作区和最新构建。"
  - "不得只检查首页或正常状态；必须覆盖全部目标路由和适用的关键状态。"
  - "不得用构建或单元测试通过替代真实浏览器视觉、交互和焦点验收。"
  - "不得把项目名称、私有路径、固定端口、固定路由、品牌值或一次性缺陷固化为跨项目默认规则。"
  - "使用非侵入式浏览器检查，避免接管用户桌面；截图和日志不得暴露范围外敏感信息。"
  - "证据不足时标记未验证或 blocked，不猜测通过，也不夸大完整无障碍合规。"
  - "不得把截图像素直接作为逻辑 CSS 尺寸；必须区分实际热区、整体缩放、浏览器缩放与截图缩放。"
  - "不得把单个画布框架的 API、固定节点距离或避让步长写成跨项目规则；必须从目标实现和项目规范取得坐标合同与阈值。"
  - "不得在只读审计中修改固定视觉基准；另行授权修复时也只能随已确认变更定向更新，不得删减断言或整体重采样掩盖问题。"
  - "测量容差必须有浏览器舍入或重复测量证据，不设跨项目通用阈值；测试序列化差异不等于 UI 缺陷。"

prompt: |-
  你正在执行“ZX UI 页面检查”。目标是把项目内权威 UI 规范转换为可核验检查项，在当前工作区
  的最新可运行构建中覆盖全部目标路由和关键状态，输出可追溯的不合规清单、跨页根因、证据边界与
  整改优先级。默认保持只读，不在审查过程中顺手修复实现。

  ## 执行步骤

  1. 定位项目根目录、规范路径、设备范围和工作区状态。读取项目约束文件，保护范围外文件和用户已有
     未提交修改；确认本次只审查实现，不反向修改权威规范。
  2. 把规范拆成原子检查项，记录条款位置、适用页面、预期值、判定条件和允许例外。覆盖产品壳、字体与
     Token、布局、组件尺寸、搜索筛选、数据状态、浮层、主题、键盘和无障碍。只有明确的“必须”、
     “不得”或数值规则才能判为硬性违规；建议项单独记录。
  3. 从路由配置、页面入口、导航和条件分支盘点全部目标页面。区分标准页面、专用工作区、动态参数页面
     和关键视觉状态；建立页面 × 角色 × 视口 × 组件状态覆盖矩阵，标记适用、不适用、已验证和未验证。
     多个路由只有在确认渲染结构相同时才能合并取证，覆盖矩阵仍须保留每个路径与实际入口；菜单隐藏
     不等于权限验证。只在已有授权范围内核对角色入口、可见数据和直链行为；未核验的服务端权限明确留空，
     不把 UI 审计扩展为未授权的权限探测。
  4. 运行输入指定或项目认可的构建命令，启动或连接预览。核对进程工作目录、构建产物资源、时间戳或
     页面资源标识；发现端口由旧工作树、旧构建或未知进程占用时，先解决来源真实性，不能把旧页面作为
     当前证据。无法证明版本时返回 blocked。
  5. 按 device_scope 使用非侵入式真实浏览器逐路由检查。记录稳定视口截图、内容边界、横向溢出、导航
     可见性、控件尺寸、布局测量和主题表现；只验证授权设备，不自行扩展移动端范围。
  6. 对适用页面检查正常、空数据、搜索无结果、加载、禁用、权限不足、失败、等待、长文本、大数据量、
     高风险和外部结果不确定状态。不能访问或不能构造的状态标为未验证，不能默认通过。
  7. 检查 Dialog、Drawer、Popover 等浮层的尺寸、头部、内容区、底部、遮罩、Escape、焦点进入、Tab
     约束和关闭回焦；检查主题切换、键盘可达性、语义名称与焦点可见性。截图不能替代焦点和键盘实测。
  8. 使用截图与浏览器测量证明实际表现，使用计算样式和源码解释原因或验证 Token 等实现约束。每个发现
     映射到明确规范条款，并标记为浏览器实测、源码佐证、合理推断或未验证；推断不能伪装成实测事实。
  9. 复核所有失败项以排除加载异常、权限、缓存或工具缩放造成的误判。把共享产品壳或公共组件根因与
     页面独有问题分开汇总，同时枚举共享问题影响的全部页面。
  10. 按 P0、P1、P2 评定影响，输出所有目标页面的通过、不通过或 blocked 结论、代表性截图、正向发现、
      证据限制和优先整改顺序。没有发现问题的页面也必须进入覆盖结果。
  11. 重新执行构建与相关测试并记录实际结果；明确构建验证可编译性、测试验证已有断言、浏览器验证视觉
      与交互，三者不能互相替代。若当前构建已有有效检查且没有新变更或证据缺口，可引用该次结果，不重复
      执行无收益检查；明确实际运行批次。最后确认审查没有修改项目文件或外部状态。

  ## 组件级深度检查

  在上述步骤中按组件是否适用执行以下检查；数量多的检查项不能抵消关键状态未验证。

  ### 语义尺寸与断点

  - 建立主操作、筛选、列表行操作、分页、浮层表单和固定底部动作的尺寸对照表。每项记录角色、页面、
    视口、组件状态、规范条款、预期逻辑值、计算样式、getBoundingClientRect 实际边界、文字与图标尺寸、
    圆角和对齐关系；数值来自目标规范，不规定统一高度或圆角。
  - 记录已知的 CSS zoom/transform、浏览器缩放、设备像素比例及截图缩放。未知项标为未知，不从图片
    外观猜测；实际热区和显示尺寸单独报告，不再次将截图缩放套到逻辑值上。
  - 不同语义组件允许有明确层级，同组控件按规范核对等高及基线。根据实际媒体查询选择断点两侧和矮屏
    场景，分别测量输入、选择、查询、重置及页头按钮，不能仅因它们共享变量就判为一致。
  - 追踪最终生效的选择器与媒体查询，区分外壳缩放、局部高度覆盖及容器留白。不能用缩小字体、二次缩放
    或裁切掩盖溢出；控件太小的结论需结合实际热区和该项目设备范围。

  ### 无限画布与流程图编辑器

  - 先确认画布框架、视口边界、坐标原点、平移量、缩放比例、节点逻辑坐标与 DOM 屏幕坐标的转换合同。
    对几何结果做比较时，必须明确使用的是流程坐标还是 `getBoundingClientRect` 屏幕坐标；存在 transform 时
    先按实际矩阵归一化，不能把缩放后的截图距离直接当成节点布局距离。
  - 对端口菜单、右键菜单和节点内 Popover 分别检查正常位置及靠近画布上、下、左、右边界的状态。
    浮层应脱离画布 transform，或使用经过验证的等价坐标换算；按照项目规范收口或翻转，保持在画布可视区域，
    内容过高时只让菜单内部滚动。验证 Escape、点击外部关闭、首个可用项焦点、键盘遍历和关闭回焦，确保
    浮层与持久界面不会完全遮挡焦点或触发控件。
  - 检查从节点端口新增下游节点的空间连续性：记录触发端口的屏幕坐标、转换后的流程坐标、来源节点位置、
    候选位置和最终位置。新增结果应按目标产品规则出现在来源附近；发生碰撞时寻找最近可用位置，不得为了
    避让移动已有节点，也不得静默重写已有连线。画布空白处新增、左侧节点库新增和端口上下文新增可以采用
    不同放置策略，但每种策略必须可解释并有独立入口验证。
  - 若新增节点前存在资源、模板或类型选择 Drawer/Dialog，记录触发时的来源端口、流程坐标和预期连线，完成
    延迟选择后再次核对最终节点位置及 Edge。不能只证明抽屉关闭或节点出现；必须同时验证坐标上下文未丢失、
    新节点未退回全图末尾、自动连线目标正确。
  - 几何与碰撞算法优先使用纯函数单测覆盖上下左右边界、已占用候选位置和回退顺序；真实浏览器在项目声明的
    视口、缩放和平移状态下验证浮层边界、节点相对距离、已有节点位置不变和连线存在。若框架只暴露屏幕尺寸，
    报告测量限制，不以宽松阈值替代坐标合同。

  ### 搜索、日期与原生编辑状态

  - 搜索和日期至少检查空值未聚焦、空值聚焦、部分输入、完整值、清空回焦、禁用、只读和错误状态。
    查询触发方式遵循项目规则，核验清空单字段与重置全部条件的作用域，不替用户改变交互模型。
  - 检查日期占位文字与原生日期片段、选中高亮是否重叠，以及值、日历图标和清空图标是否互相遮挡；
    打开日历后检查选择、键盘、Escape、回焦和嵌套浮层关闭边界。
  - 格式化前后比较底层值，包含时区、秒及小数秒等原始精度；空值不得被无依据地填成今天。只读或禁用
    状态不得通过图标、清空按钮或键盘绕过。
  - 原生控件内部状态可能无法通过常规 computed style 完整读取。不能把伪元素查询的回退值当成真实
    渲染；需用可重复交互、截图及值变化佐证，无法验证时说明证据限制。

  ### 操作列与控件边界

  - 对固定操作列验证无横向溢出、初始有溢出、滚动中、最右侧、从最右侧滚回，以及窗口/数据/页容量/
    操作文案变化后的状态。分隔线或阴影何时显示由项目规范决定，不固化单一视觉偏好。
  - 分别测量表格滚动容器、固定列、按钮和图标边界；检查被覆盖、裁切、按钮换行、图标偏移与热区重叠。
    document 没有横向溢出只证明页面边界，不能证明内部控件完整。
  - 复查 default、hover、active、focus-visible、disabled 的尺寸、颜色和可读性。优先检查通用选择器
    对危险按钮、清空图标、日期图标等组件的串扰，并记录实际生效规则及受影响入口。

  ### 基准、容差与回归证据

  - 将失败分为真实 UI 偏差、测试/样式序列化差异、亚像素舍入、环境或数据不稳定以及未确定原因；先复现
    和取证，再建议修复。颜色等值序列化与数值舍入需分别处理，不能用一个宽松匹配规则统统放过。
  - 若需要几何测量容差，报告误差来源、重复测量结果、单位与阈值理由。没有证据不得放宽断言；容差不能
    应用到颜色语义、权限、状态机或固定条款的精确值检查上。
  - 只读阶段对基准变更提出建议而不写入。另行获得修复授权后，应逐项列出已确认决策、原值、新值及影响
    范围，只更新对应基准；禁止删除断言、重采样全部页面或改业务结果使测试变绿。
  - 核对测试实际覆盖内容：属性检查数量不代表测过高度、全部状态或全部页面。对缺失的测量或状态建议
    新增专项检查，不把已有通过数量当作完整性证明。
  - 对画布编辑器，测试数量还必须区分菜单边界、坐标转换、碰撞避让、延迟资源选择和最终连线；任一环节
    未验证都不能用“节点已创建”概括为完整通过。
  - 每次结果绑定实际命令、目标构建、视口和覆盖范围。完整回归与后续专项复测分别报告，不能相加并称为
    同一次全量运行；未复测的影响范围明确列出。没有新变更、失败或证据缺口时不重复无收益的测试。

  ## 严重级别

  - P0：破坏核心可用性、关键信息可读性、明确设备门禁、焦点约束或高风险交互安全。
  - P1：违反明确布局、尺寸、组件结构、操作语义或关键状态要求，显著影响一致性和任务完成。
  - P2：次要一致性、低频状态或非阻断体验问题；不得把纯审美偏好列为违规。

  ## 输出要求

  严格按 output_schema 返回：scope_summary 说明路由、状态、设备和主题范围；global_findings 汇总共享根因；
  page_findings 逐页列出路径、角色、视口、组件状态、严重级别、规范条款、预期、实际、证据和置信度；
  在现有 findings 对象中按需记录覆盖矩阵行和尺寸对照，不新增顶层必填字段。global_findings 按共享根因
  归并并枚举实际受影响入口，不能因组件复用就假定所有入口已测；positive_findings
  记录已验证符合项；validation_evidence 记录实际命令、截图和交互结果；evidence_limitations 说明未覆盖
  的权限、数据、设备、浏览器、读屏或动态状态；next_actions 给出最小整改顺序或后续验证动作。

  质量标准：

  - 审查范围内每个路由都有明确结论、主要问题和可访问的证据链接。
  - 每个硬性违规都能追溯到规范条款，并至少由截图、DOM 测量、计算样式、交互观察或源码之一支持。
  - 预览被证明确实来自当前工作区最新构建，不把旧端口或旧工作树页面当作当前结果。
  - 设备与主题范围遵循用户和规范边界；未授权设备不进入验收结论。
  - 共享组件或产品壳问题与页面独有问题分开汇总，避免重复计数和逐页复制。
  - 可访问性结论区分已实测行为和未覆盖范围，不以截图替代键盘、焦点或语义验证。
  - 报告同时列出不合规项、已符合项、证据限制、验证命令结果和最小下一步。
  - 保持只读，不修改业务代码、设计规范、OPCSkills 仓库或范围外用户文件。

