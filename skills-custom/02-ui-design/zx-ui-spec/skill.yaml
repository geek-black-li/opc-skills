schema_version: "1.0"
id: zx-ui-spec
name: "ZX UI 规范整理"
version: "1.0.0"
description: "当需要从现有代码、设计资料、用户反馈和验证证据中整理、补全或重建一份唯一、自解释、可直接执行的 UI 规范时使用。"
category: 02-ui-design
origin: custom
status: active

triggers:
  intents:
    - "从现有项目提炼完整 UI 设计规范"
    - "把分散的页面规则整理成唯一设计系统文档"
    - "重建可供新设计师、工程师或 AI 独立使用的 UI 规范"
    - "审查 UI 规范是否完整、自解释且可验收"
  keywords:
    - "UI规范整理"
    - "整理UI规范"
    - "设计规范整理"
    - "唯一UI规范"
    - "界面规范重建"
    - "zx-ui-spec"

input_schema:
  type: object
  properties:
    project_root:
      type: string
      description: "目标项目根目录。"
    target_document:
      type: string
      description: "唯一 UI 设计规范的目标路径；未指定时建议为项目 docs/UI设计规范.md，并在写入前说明。"
    product_context:
      type: string
      description: "产品类型、主要用户、界面任务和已明确边界。"
    evidence_paths:
      type: array
      items:
        type: string
      description: "设计文档、Token、主题、组件、页面、测试、截图或反馈路径。"
    device_scope:
      type: string
      description: "目标设备、主要视口和最低兼容范围。"
    action:
      type: string
      enum:
        - analyze
        - write
        - audit
      default: analyze
      description: "只读提案、写入规范或审查现有规范。"
  required:
    - project_root
    - product_context
    - action
  additionalProperties: false

output_schema:
  type: object
  properties:
    result:
      type: string
      enum:
        - analyzed
        - created
        - updated
        - accepted
        - blocked
    target_document:
      type: string
    evidence_summary:
      type: array
      items:
        type: string
    resolved_conflicts:
      type: array
      items:
        type: string
    project_specific_exclusions:
      type: array
      items:
        type: string
    validation:
      type: array
      items:
        type: string
    open_decisions:
      type: array
      items:
        type: string
    next_actions:
      type: array
      items:
        type: string
  required:
    - result
    - evidence_summary
    - resolved_conflicts
    - project_specific_exclusions
    - validation
    - open_decisions
    - next_actions
  additionalProperties: false

constraints:
  - "不得把任何客户名、项目名、品牌色、固定 URL、模块名称、设备策略或私有路径固化为跨项目默认规则。"
  - "不得把当前代码自动视为正确设计；必须区分明确决策、稳定模式、偶然实现和已知缺陷。"
  - "不得依赖读者了解版本代号、方案编号、历史对话、旧页面或截图；目标规范必须自解释。"
  - "不得捏造缺失的颜色、尺寸、组件边界或设备范围；关键冲突无法解决时返回 blocked。"
  - "不得通过缩小字体、隐藏内容或取消状态解决布局问题。"
  - "不得修改业务权限、数据状态和流程语义来迎合视觉规范。"
  - "不得读取或提交范围外的用户文件；保留已有未提交修改。"
  - "action=analyze 或 audit 时保持只读；action=write 也不得自动提交、推送、部署或发布。"
  - "生成后必须验证目标文件可独立阅读、无占位符、无上下文依赖、无冲突数值且包含交付检查表。"

prompt: |-
  你正在执行“ZX UI 规范整理”。目标不是总结某个页面的视觉印象，而是基于可验证的项目事实，将分散、冲突或依赖历史上下文的界面规则整理成一份项目专属、唯一、自解释、包含明确数值和验收门禁的 UI 设计规范，使没有项目历史上下文的设计师、工程师或 AI 能据此继续开发。

  ## 执行模式

  - `action=analyze`：只读盘点证据、冲突、缺口和建议结构，不写入目标文档。
  - `action=write`：在完成证据盘点和冲突处理后，创建或更新唯一 UI 设计规范；不得自动提交、推送、部署或发布。
  - `action=audit`：只读审查现有规范的完整性、自解释性、一致性与可验收性。
  - 未提供 `target_document` 时，建议使用项目内 `docs/UI设计规范.md`，并在任何写入前明确实际目标路径。

  ## 工作流

  1. 定位项目根目录、目标规范路径和现有工作区状态；保留范围外文件，不把未授权变更纳入交付。
  2. 明确规范的产品范围、目标用户、设备与视口范围、技术栈、主题范围和交付用途；不能从通用偏好推断项目专属决策。
  3. 盘点正式设计资料、设计 Token、主题配置、共享组件、主要页面、视觉测试、截图、用户反馈和已验证修正；建立证据清单并排除临时文件和无关历史资料。
  4. 区分明确的产品决策、稳定的共享实现、单页偶然样式和已知缺陷；现有代码与明确决策冲突时把代码标为待整改项，不反向升级为规范。
  5. 建立冲突清单，按明确用户决策、当前权威资料、稳定共享组件、重复验证证据的优先级解决；无法可靠解决的关键数值或范围必须阻断写入并请求确认。
  6. 提炼产品界面目标与原则，并完整定义颜色、字体、间距、圆角、边框、阴影、图标和动效 Token；每项包含实际值、语义、使用场景和禁止场景。
  7. 定义页面骨架、布局类型、一级与二级导航、标题、容器、卡片、按钮、表单、搜索筛选、表格列表、状态、分页、抽屉、Dialog、Popover、Tabs、反馈和业务专用界面；关键组件必须包含选择条件、尺寸、状态、溢出、键盘和无障碍规则。
  8. 定义正常、空数据、无搜索结果、加载、禁用、权限不足、失败、等待、长文本、大数据量和高风险操作等状态，不允许只描述成功页面。
  9. 删除依赖历史上下文的表述，将版本代号、方案编号、参考旧页面、参考图片、此前确认、保持现状和模糊形容词改写为明确数值、组件语义和判断条件。
  10. 加入实现约束、组件尺寸速查表和可逐项执行的浏览器验收清单；说明自动化测试、构建和真实视觉检查各自负责的范围。
  11. 对目标文档执行占位符、上下文依赖、模糊措辞、章节完整性、数值冲突、内部引用和格式检查；以陌生接手者只读该文档能否完成页面为独立可读性标准。
  12. 仅在用户授权的目标路径创建或更新规范；输出来源概览、冲突处理、排除的项目偶然项、验证结果和仍需人工决定的例外，不自动提交、推送或发布。

  ## 证据与冲突处理

  建立包含来源路径、证据类型、适用范围、可信度和冲突状态的证据清单。按以下优先级处理冲突：

  1. 当前任务中明确且未被撤销的产品决策。
  2. 项目声明的权威设计资料或正式规范。
  3. 多个页面共同使用且经过验证的 Token、主题和共享组件。
  4. 重复出现并有浏览器或测试证据支持的稳定实现。
  5. 单页实现、临时样式、截图偶然状态和未验证历史资料只能作为线索，不能直接成为规则。

  若关键品牌值、尺寸、设备范围、组件选择条件或业务边界仍有冲突，返回 `blocked`，在 `open_decisions` 中列出需要决定的最小问题，不以通用审美替代项目决策。

  ## 规范最低内容

  目标规范至少应独立覆盖：

  - 文档权威性、适用范围、目标读者、冲突优先级和例外处理。
  - 产品界面目标、信息层级、密度、反馈和一致性原则。
  - 颜色、字体、间距、圆角、边框、阴影、图标、动效等 Token，包含变量名、实际值、语义、使用与禁止场景。
  - 页面骨架、内容宽度、栅格、留白、一级导航、二级导航、面包屑、页面标题和内容容器。
  - 卡片、按钮、表单控件、搜索、筛选、表格、列表、状态、分页、空态、消息反馈和危险操作。
  - 抽屉、Dialog、Popover、Tooltip、Tabs 等浮层与导航组件，包括层级、头部、内容、底部、关闭、回焦和键盘行为。
  - 项目业务专用界面的布局与交互规则，但不得把这些项目专属名称固化回本 Skill。
  - 正常、空数据、无结果、加载、禁用、权限不足、失败、等待、长文本、大数据量和高风险操作状态。
  - 实现约束、组件尺寸速查表、新页面交付检查表和真实浏览器验收清单。

  ## 关键组件写法

  每个关键组件都必须回答：

  - 何时使用、何时禁止使用、与相邻组件如何选择。
  - 尺寸、字体、颜色、间距、图标、边框、圆角和内容限制。
  - Default、Hover、Active、Focus、Disabled、错误、加载和完成状态。
  - 长文本、窄容器、大数据量和内容溢出的处理。
  - 键盘操作、焦点进入与返回、语义名称和必要的无障碍要求。
  - 可被自动化测试的断言和必须由真实浏览器视觉检查的项目。

  ## 质量标准

  1. 文档明确声明权威范围、冲突优先级、适用对象、设备范围和例外处理方式。
  2. 设计 Token 同时给出变量名、实际值、语义、使用场景和禁止场景，不要求读者查阅旧文档。
  3. 核心组件完整覆盖使用条件、禁止条件、尺寸、字体、颜色、间距、默认、Hover、Active、Focus、Disabled、错误、溢出、键盘和无障碍。
  4. 页面布局、导航、标题、容器、数据展示、浮层、反馈、业务专用界面和交付验收均有独立章节。
  5. 正常、空态、无结果、加载、禁用、权限不足、失败、等待、长文本、大数据量和危险操作均有规则。
  6. 全文不包含占位内容，也不使用方案编号、版本代号或参考旧页面作为规则依据。
  7. 无法量化的规则提供明确选择条件；不能可靠确定的关键决策被列为阻断项而不是由 Skill 猜测。
  8. 项目名称、品牌色、固定路径、模块名称、设备策略和技术选型只进入该项目产物，不固化为 Skill 的跨项目默认值。
  9. 目标文档通过格式、占位符、上下文依赖、模糊措辞、内部矛盾和必要章节自动检查。
  10. 最终输出包含可执行的组件速查表和新页面交付检查表，并说明真实浏览器验收证据。

  ## 验证

  在返回成功结果前执行与权限相符的检查：

  - 目标文件存在且位于用户授权路径。
  - 文档无占位内容、历史方案引用、版本代号依赖和无法执行的模糊措辞。
  - Token 数值、组件尺寸和同类状态规则没有内部冲突。
  - 必要章节、组件速查表、新页面交付检查表和浏览器验收清单齐全。
  - 文档中的路径、锚点、变量名和组件名能够在项目中核对，或明确标为待实现而非现行事实。
  - 陌生接手者无需读取历史对话、旧版本或截图即可理解并实施。

  自动化检查用于验证格式、结构、引用、Token 和可测试状态；构建用于验证实现可编译和产物完整；真实浏览器检查用于验证视觉层级、密度、溢出、浮层、焦点和关键交互。三者不能互相替代。

  ## 输出要求

  按输出 Schema 返回：

  - `result`：实际结果；存在未解决关键决策时必须为 `blocked`。
  - `target_document`：实际审查或写入的规范路径；只读分析且尚未确定路径时可省略。
  - `evidence_summary`：使用的证据类别与代表性来源。
  - `resolved_conflicts`：已解决冲突、采用规则及理由。
  - `project_specific_exclusions`：明确未固化为跨项目默认值的项目专属内容或偶然实现。
  - `validation`：实际执行的检查和结果，不得把未运行的检查写成通过。
  - `open_decisions`：仍需人工决定的关键问题；没有则返回空数组。
  - `next_actions`：最小、可执行的后续动作；没有则返回空数组。

