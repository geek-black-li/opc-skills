schema_version: "1.0"
id: zx-project-organizer
name: "ZX 项目结构整理"
version: "2.0.0"
description: "当需要初始化项目工作区、审计或重构现有目录、归类文件、梳理权威文档，或治理 AI 上下文和历史资料时使用。"
category: 06-project-manage
origin: custom
status: active

triggers:
  intents:
    - "规划或创建新项目目录结构"
    - "审计现有项目的文件与目录"
    - "重新归类并重构老项目目录"
    - "判断需求、设计、Demo、调研或测试资料应放在哪里"
    - "制定 AGENTS.md、权威文档、归档和上下文读取规则"
  keywords:
    - zx-project-organizer
    - 项目结构
    - 工作区整理
    - 目录重构
    - 文件归类
    - AGENTS.md
    - 权威文档
    - 上下文治理
    - OPC独立开发

input_schema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - initialize
        - audit
        - reorganize
      description: "initialize 初始化新项目；audit 只读审计；reorganize 经确认后重构现有项目。"
    project_root:
      type: string
      description: "用户授权处理的项目根目录。"
    context:
      type: string
      description: "项目阶段、协作方式、代码组织、目标与已知约束。"
    artifacts:
      type: array
      description: "用户点名的文件、目录或需要判断归属的产物。"
      items:
        type: string
    requirements:
      type: array
      description: "必须保留的约定、目标结构、验收命令和其他要求。"
      items:
        type: string
    confirmed_facts:
      type: array
      description: "用户已经确认、现有权威文件明确记录或当前工作区可验证的项目事实；不得把 AI 推断写入此处。"
      items:
        type: object
        properties:
          fact:
            type: string
          source:
            type: string
            description: "事实来源，例如用户本轮明确说明、README 路径、决策记录或可验证配置。"
        required:
          - fact
          - source
        additionalProperties: false
    approved_migration_map:
      type: array
      description: "reorganize 模式下用户已经确认的原路径到新路径映射；没有确认时只能提出方案。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
        required:
          - source
          - target
        additionalProperties: false
  required:
    - mode
    - project_root
    - context
  additionalProperties: false

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: "当前模式、结论与是否发生文件变更。"
    structure_assessment:
      type: array
      description: "合理结构、重复边界、错放内容、过度设计和风险。"
      items:
        type: string
    fact_register:
      type: object
      description: "初始化或重构前的事实登记；明确区分已确认事实、当前推断和会影响结构的未知事项。"
      properties:
        confirmed:
          type: array
          items:
            type: string
        inferred:
          type: array
          items:
            type: string
        unknown:
          type: array
          items:
            type: string
      required:
        - confirmed
        - inferred
        - unknown
      additionalProperties: false
    proposed_structure:
      type: string
      description: "适配当前项目的推荐目录树；不需要调整时说明保留现状。"
    placement_rules:
      type: array
      description: "常见产物的唯一推荐位置与边界。"
      items:
        type: string
    migration_map:
      type: array
      description: "逐项列出的原路径、新路径、理由、影响与处置状态。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
          reason:
            type: string
          impact:
            type: string
          status:
            type: string
            enum:
              - proposed
              - moved
              - unchanged
              - needs-confirmation
        required:
          - source
          - target
          - reason
          - impact
          - status
        additionalProperties: false
    authority_map:
      type: array
      description: "主题、当前权威文件、历史位置与冲突处理规则。"
      items:
        type: string
    context_policy:
      type: array
      description: "AI 默认读取、按需读取、默认不读取和忽略内容的规则。"
      items:
        type: string
    changes:
      type: array
      description: "本次实际创建、移动、修改或删除的内容；只读模式为空。"
      items:
        type: string
    validation:
      type: array
      description: "实际执行的结构、引用、构建、测试和版本库验证及结果。"
      items:
        type: string
    follow_ups:
      type: array
      description: "仍需用户确认、无法可靠归类或受阻的事项。"
      items:
        type: string
  required:
    - summary
    - structure_assessment
    - fact_register
    - proposed_structure
    - placement_rules
    - migration_map
    - authority_map
    - context_policy
    - changes
    - validation
    - follow_ups
  additionalProperties: false

constraints:
  - "仅处理 project_root 及用户明确授权的项目范围，保留范围外文件和外部状态。"
  - "audit 模式只读，不创建、移动、重命名、修改或删除任何文件。"
  - "initialize 模式先提交目录、文件和规则清单；未获用户确认前不落盘。"
  - "initialize 模式提出最终结构前必须建立事实登记；决定稳定代码边界、文档分类或编号的关键信息未知时，只返回 needs-input，不用默认模板替用户做决定。"
  - "空工作区只证明尚未落盘，不证明项目类型、代码边界、文档分类或技术决策尚未确认。"
  - "用户已确认的长期职责边界即使当前为空也应进入初始化清单；AI 推断或仅为未来可能需要的模块不得视为已确认事实。"
  - "reorganize 模式必须先提交完整迁移映射；仅执行用户明确确认的映射，不以赶进度为由跳过门禁。"
  - "移动、覆盖、归档或删除有未提交修改的文件前必须明确报告影响；不擅自 stash、还原或丢弃用户修改。"
  - "不覆盖同名目标；无法可靠分类、存在冲突或用途不明的内容必须列入 needs-confirmation。"
  - "优先服从框架、构建、部署和既有稳定工程约定，不为统一外观强制套用固定目录模板。"
  - "按产物用途、成熟度和权威性分类，不按创建者、AI 工具或文件格式作为首要分类。"
  - "可预建长期稳定的文档分类；不因未来可能需要而预建微服务、消息队列、部署或其他推测性技术模块。"
  - "当前权威资料与历史资料必须分离；归档、日志、构建产物和原始测试输出默认不作为当前事实来源。"
  - "AGENTS.md 只保存短小、长期有效且可执行的规则，不写入过程流水账、完整历史或大段项目知识。"
  - "默认不删除仍有审计、决策或发布证据价值的资料；物理删除必须有精确目标和用户明确授权。"
  - "移动已跟踪文件时优先保留版本历史；移动代码或配置后必须修复引用并执行与风险相称的验证。"

prompt: |-
  你正在执行“ZX 项目结构整理”。目标是在不破坏用户现有工作的前提下，为 AI 驱动项目建立清晰、
  可扩展且上下文友好的目录与文件规则，并安全处理老项目重构。

  核心原则：目录是项目地图，不是成熟度装饰。只建立已经存在的职责边界；稳定文档分类可以预建，
  尚未出现的技术模块不得预建。普通文件数量不会自动成为 AI 上下文，真正需要控制的是默认指令、
  实际读取内容、长对话和工具输出。

  先建立项目事实登记，再设计目录：
  - confirmed：仅收录用户在当前可见上下文明确说明、confirmed_facts 提供、权威文件记录或工作区可验证的事实。
  - inferred：收录根据空目录、文件名、惯例或项目名称做出的推断；推断只能作为建议理由，不能成为创建依据。
  - unknown：收录会改变目录方案但当前没有证据的问题，例如单仓/多仓、是否独立前后端、是否预建固定文档分类。
  - 如果用户引用了先前任务、讨论或决策，且当前环境能够读取，先读取对应任务或权威文件；无法读取时请求用户提供结论，
    或先把结论写入当前项目的决策文件。不得用“工作区为空”覆盖先前已经确认但当前不可见的事实。

  使用以下目录创建判定，不以“当前是否已有文件”作为唯一标准：
  - 已确认且长期稳定的职责边界：初始化时创建。包括用户已确认的前端、后端、实验代码或固定文档分类，即使尚无内容。
  - 已确认但由框架脚手架负责生成的结构：记录目标与生成方式，在执行对应脚手架时创建，避免提前制造冲突。
  - 仅由 AI 推断的分类：标记 inferred，只提出备选，不纳入最终创建清单。
  - 会实质改变结构的未知事项：标记 unknown，返回 needs-input；不得自行选择“最小结构”或“成熟结构”。
  - 推测性技术模块和尚未发生的运维、集成、迁移能力：不创建。
  - 归档、日志和机器数据目录：仅在已有内容、工具约定或明确保留政策时创建。

  先按 mode 执行：

  1. initialize（新项目初始化）
     - 读取用户目标、项目阶段、代码形态和协作方式，检查根目录现状与适用约束。
     - 先输出 fact_register。已确认事实必须带有可说明的来源；空目录检查结果只记录为“尚未落盘”。
     - 如果 unknown 中仍有会改变一级目录、代码边界、稳定文档分类或编号的事项，不生成最终推荐结构，
       proposed_structure 只说明待决定边界，创建清单保持为空，并在 follow_ups 提出最少的关键问题。
     - 提出两到三种结构方案时保持简短，明确推荐方案及取舍；不把成熟企业的职能树机械套给早期项目。
     - 为 AI 主导的 OPC 项目，优先采用“稳定文档分类预建、代码结构按真实模块最小化”的策略。
     - “真实模块”以 confirmed 为准，而不是以目录中已经出现代码为准。已确认前端、后端或实验代码是长期边界时，
       将对应目录列入创建清单；不得因为技术栈未选定而删除这些逻辑边界。
     - 只创建 confirmed 中的稳定分类。不得一边省略已确认代码边界，一边预建未确认的 architecture、operations、
       deployment、migrations、integrations 或 archive。
     - 先输出 proposed_structure、placement_rules、authority_map、context_policy 和待创建文件清单。
     - 只有用户确认后才创建；用有说明价值的 README 保留必要空目录，不堆积无意义的 .gitkeep。

  2. audit（现有项目只读审计）
     - 先读取适用的 AGENTS.md、README、版本库状态、目录树、技术栈清单、构建测试配置和文档索引。
     - 识别真实运行边界、现有稳定约定、未提交修改、符号链接、生成物、路径引用和大体积资料。
     - 检查重复分类、编号断层、同主题多份当前文档、历史与现行混放、日志被提交、代码与文档错放等问题。
     - 区分“结构看起来不同”和“结构实际造成成本”；已有结构可运行且边界清楚时明确建议不重构。
     - 只输出审计、建议与完整 migration_map，不做任何写入。

  3. reorganize（确认后的现有项目重构）
     - 若没有 approved_migration_map 或用户没有明确确认本轮映射，退回只读方案阶段；不得先移动所谓低风险文件。
     - 重新核对版本库状态与目标冲突，只执行已确认映射。已跟踪文件优先使用能保留历史的移动方式。
     - 按小批次处理：非代码资料、文档与引用、代码与配置；每批完成后立即验证，失败即停止扩大影响。
     - 更新受影响的 import、路径别名、Markdown 链接、脚本、环境示例、容器、CI、部署与测试夹具。
     - 不直接删除旧资料；先依据权威性和证据价值判断保留、归档、Git 历史保留或请求精确删除授权。

  文件归类使用以下判断顺序：
  1. 先判断它是源码、当前正式文档、原始调研输入、设计交付、测试证据、机器生成物还是历史资料。
  2. 再判断成熟度与状态，例如低保真/高保真、草稿/当前有效/已替代、实验代码/正式代码。
  3. 最后选择现有可承载位置；只有形成长期独立职责且现有边界无法承载时才新增目录。
  4. 原始输入与整理结论分开；验收标准与验收记录分开；自动化测试跟随代码，业务测试文档进入文档区。

  上下文治理必须形成四层：
  - 常驻入口：短小的 AGENTS.md、根 README、当前状态和文档索引。
  - 当前资料：与任务直接相关的唯一权威 PRD、设计、验收或架构文档，按需读取。
  - 历史资料：已替代规格、完成计划和旧报告，可检索但默认不读，不得作为当前事实来源。
  - 机器数据：日志、缓存、构建产物、覆盖率和原始测试输出，通常忽略或限期保留，仅在诊断时读取局部。

  为每个主题指定唯一权威入口。发现文档与运行代码冲突时报告冲突，不自行宣布其中一方正确。
  任务结束后把稳定结论写回权威文档；不要把聊天记录或 AI 长期记忆当作项目唯一事实来源。

  验证要求：
  - 所有模式都报告实际检查证据；没有执行的检查不得写成已通过。
  - initialize 验证创建清单、目录边界、README/AGENTS 规则和版本库可见性。
  - reorganize 至少检查版本库差异、路径引用和文档链接；涉及代码时运行对应 lint、测试、构建或启动检查。
  - 最终严格按 output_schema 返回；明确区分 proposed、moved、unchanged 和 needs-confirmation。

