schema_version: "1.0"
id: zx-project-organizer
name: "ZX 项目结构整理"
version: "6.0.0"
description: "当需要引导创建全新项目、生成独立前后端应用骨架、审计或重构存量项目时使用。支持逐问逐答和推荐选项，但推荐不等于确认；完整提案匹配确认后才写入。"
category: 06-project-manage
origin: custom
status: active

proposal_binding:
  fields:
    - mode
    - workflow_mode
    - project_root
    - project_facts
    - recommendation_register
    - structure_profile
    - fact_register.confirmed
    - application_plan
    - scaffold_plan
    - proposed_structure
    - structure_comparison
    - creation_plan
    - migration_map
    - initialize_git
  field_semantics:
    project_root: resolved-authorized-project-root

triggers:
  intents:
    - "规划或创建新项目目录结构"
    - "引导用户完善全新项目创建流程"
    - "按应用生成可运行的前端、Go、Python 或 Node.js 项目骨架"
    - "审计现有项目的文件与目录"
    - "重新归类并重构老项目目录"
    - "判断需求、设计、Demo、调研或测试资料应放在哪里"
    - "制定 AGENTS.md、权威文档、归档和上下文读取规则"
  keywords:
    - zx-project-organizer
    - 项目结构
    - 工作区整理
    - 目录重构
    - 文件归类
    - AGENTS.md
    - 权威文档
    - 上下文治理
    - OPC独立开发
    - ZX完整结构
    - 完整交付目录
    - 自定义目录树
    - 引导创建项目
    - 可运行代码骨架
    - 前后端应用
    - 存量项目整理

input_schema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - initialize
        - audit
        - reorganize
      description: "initialize 初始化新项目；audit 只读审计；reorganize 重构现有项目。"
    workflow_mode:
      type: string
      enum:
        - auto
        - new-project
        - existing-project
      default: auto
      description: "引导工作流。auto 根据用户明确说明和只读工作区证据判断；有歧义时必须询问。"
    action:
      type: string
      enum:
        - propose
        - apply
      default: propose
      description: "propose 只生成提案；apply 仅在 confirmation 匹配当前提案时执行。audit 只接受 propose。"
    project_root:
      type: string
      description: "用户授权处理的项目根目录。"
    context:
      type: string
      description: "项目阶段、协作方式、代码组织、目标与已知约束。"
    project_facts:
      type: object
      description: "引导过程中已收集的项目基础事实；缺失字段由 guided_question 逐项询问。"
      properties:
        purpose:
          type: string
        target_users:
          type: array
          items:
            type: string
        stage:
          type: string
          enum:
            - research
            - prototype
            - mvp
            - development
            - maintenance
        display_name:
          type: string
        project_slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        has_frontend:
          type: boolean
        has_backend:
          type: boolean
      additionalProperties: false
    applications:
      type: array
      description: "逐个登记的前后端独立应用；字段未知时留空并由引导问题补齐。"
      items:
        type: object
        properties:
          id:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          side:
            type: string
            enum:
              - frontend
              - backend
          name:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          role:
            type: string
          application_type:
            type: string
            enum:
              - backend-monolith
              - backend-application
              - api-gateway
              - bff
              - background-worker
              - scheduled-job
              - data-sync
          responsibility:
            type: string
            minLength: 1
          terminal:
            type: string
            minLength: 1
          runtime:
            type: string
          framework:
            type: string
          existing:
            type: boolean
          scaffold_decision:
            type: string
            enum:
              - generate
              - skip
              - undecided
          specifications:
            type: array
            items:
              type: string
              enum:
                - http-api
                - rpc
                - messages
        required:
          - id
          - side
        allOf:
          - if:
              properties:
                side:
                  const: backend
              required:
                - side
            then:
              required:
                - application_type
                - role
          - if:
              properties:
                side:
                  const: frontend
              required:
                - side
            then:
              not:
                required:
                  - application_type
          - if:
              properties:
                application_type:
                  const: backend-monolith
              required: [application_type]
            then:
              properties:
                role:
                  const: "单体后端"
          - if:
              properties:
                application_type:
                  const: backend-application
              required: [application_type]
            then:
              required:
                - responsibility
              properties:
                role:
                  const: "独立后端应用"
          - if:
              properties:
                application_type:
                  const: api-gateway
              required: [application_type]
            then:
              properties:
                role:
                  const: "API 网关"
          - if:
              properties:
                application_type:
                  const: bff
              required: [application_type]
            then:
              required:
                - terminal
              properties:
                role:
                  const: "BFF"
          - if:
              properties:
                application_type:
                  const: background-worker
              required: [application_type]
            then:
              properties:
                role:
                  const: "后台任务"
          - if:
              properties:
                application_type:
                  const: scheduled-job
              required: [application_type]
            then:
              properties:
                role:
                  const: "定时任务"
          - if:
              properties:
                application_type:
                  const: data-sync
              required: [application_type]
            then:
              properties:
                role:
                  const: "数据同步"
          - if:
              properties:
                application_type:
                  const: data-sync
                existing:
                  const: false
              required: [application_type, existing]
            then:
              required: [name]
              properties:
                name:
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*-data-sync(?:-job)?$"
        additionalProperties: false
    scaffold_strategy:
      type: string
      enum:
        - all-skip
        - all-generate
        - selective
      description: "新应用的批量代码骨架策略；selective 时必须指定应用 ID。"
    scaffold_application_ids:
      type: array
      description: "scaffold_strategy=selective 时选择生成代码骨架的应用 ID。"
      minItems: 1
      items:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      uniqueItems: true
    recommendation_updates:
      type: array
      description: "用户对当前引导推荐的逐项决定；未列出的推荐继续保持 proposed。"
      items:
        type: object
        properties:
          question_id:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          decision:
            type: string
            enum:
              - accept
              - reject
              - revise
          selected_option_id:
            type: string
          selected_option_numbers:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              minimum: 1
          revised_answer:
            type: string
          source:
            type: string
        required:
          - question_id
          - decision
          - source
        additionalProperties: false
        allOf:
          - if:
              properties:
                decision:
                  const: revise
              required:
                - decision
            then:
              required:
                - revised_answer
    structure_profile:
      type: string
      enum:
        - zx-full-delivery
        - adaptive
        - custom
      description: "initialize 的结构策略：ZX 完整交付结构、自适应最小结构或用户自定义结构；没有默认值。"
    requested_structure:
      type: string
      description: "structure_profile=custom 时必填的完整目标目录树或逐行路径清单；视为权威结构。"
    artifacts:
      type: array
      description: "用户点名的文件、目录或需要判断归属的产物。"
      items:
        type: string
    requirements:
      type: array
      description: "必须保留的约定、目标结构、验收命令和其他要求。"
      items:
        type: string
    confirmed_facts:
      type: array
      description: "用户已确认、权威文件明确记录或当前工作区可验证的项目事实；不得放入 AI 推断。"
      items:
        type: object
        properties:
          fact:
            type: string
          source:
            type: string
            description: "事实来源，例如用户本轮说明、README 路径、决策记录或可验证配置。"
        required:
          - fact
          - source
        additionalProperties: false
    pending_fact_proposals:
      type: array
      description: "上一轮由 AI 提出但尚未被用户逐项确认的事实；每项必须有稳定 id。"
      items:
        type: object
        properties:
          id:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          fact:
            type: string
          source:
            type: string
        required:
          - id
          - fact
          - source
        additionalProperties: false
    fact_updates:
      type: array
      description: "用户对 pending_fact_proposals 的逐项决定；未列出的事实继续保持 proposed。"
      items:
        type: object
        properties:
          fact_id:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          decision:
            type: string
            enum:
              - confirm
              - reject
              - revise
          revised_fact:
            type: string
            description: "decision=revise 时的新事实。"
          source:
            type: string
            description: "用户本轮明确表达或其他可验证来源。"
        required:
          - fact_id
          - decision
          - source
        additionalProperties: false
        allOf:
          - if:
              properties:
                decision:
                  const: revise
              required:
                - decision
            then:
              required:
                - revised_fact
    approved_migration_map:
      type: array
      description: "reorganize apply 时用户确认的原路径到新路径映射，必须与提案完全一致。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
        required:
          - source
          - target
        additionalProperties: false
    initialize_git:
      type: boolean
      default: false
      description: "是否把 Git 初始化纳入 initialize 提案；只有显式 true 且提案确认匹配时才允许执行。"
    approved_proposal:
      type: object
      description: "action=apply 时必填；必须原样传回 propose 输出的 proposal_id 和 canonical_payload。"
      properties:
        proposal_id:
          type: string
          pattern: "^zpo-[a-f0-9]{16}$"
        canonical_payload:
          type: string
          description: "propose 输出的 proposal_payload 原文，不得重新生成、重排或修改。"
      required:
        - proposal_id
        - canonical_payload
      additionalProperties: false
    confirmation:
      type: object
      description: "action=apply 时必填，必须确认当前提案的 proposal_id。"
      properties:
        confirmed:
          const: true
        proposal_id:
          type: string
          pattern: "^zpo-[a-f0-9]{16}$"
      required:
        - confirmed
        - proposal_id
      additionalProperties: false
  required:
    - mode
    - context
  allOf:
    - if:
        properties:
          scaffold_strategy:
            const: selective
        required:
          - scaffold_strategy
      then:
        required:
          - scaffold_application_ids
  additionalProperties: false

output_schema:
  type: object
  properties:
    result:
      type: string
      enum:
        - needs-input
        - awaiting-confirmation
        - audited
        - migration-proposed
        - initialized
        - reorganized
        - blocked
        - validation-failed
    proposal_id:
      description: "可执行提案的内容指纹；无需确认或无法成案时为 null。"
      oneOf:
        - type: string
          pattern: "^zpo-[a-f0-9]{16}$"
        - type: "null"
    proposal_payload:
      description: "用于复算 proposal_id 和执行的 canonical JSON 原文；无可执行提案时为 null。"
      oneOf:
        - type: string
        - type: "null"
    summary:
      type: string
      description: "当前模式、动作、结论与是否发生文件变更。"
    workflow_mode:
      type: string
      enum:
        - new-project
        - existing-project
      description: "本轮实际采用的引导工作流。"
    guided_question:
      description: "当前唯一需要用户回答的问题；可以成案或无需再问时为 null。"
      oneOf:
        - type: object
          properties:
            id:
              type: string
            sequence:
              type: integer
              minimum: 1
            question:
              type: string
            why_asked:
              type: string
            selection_mode:
              type: string
              enum:
                - single
                - multiple
            recommended_option_id:
              type: string
            recommendation_reason:
              type: string
            options:
              type: array
              minItems: 2
              maxItems: 8
              items:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: integer
                    minimum: 1
                  label:
                    type: string
                  impact:
                    type: string
                required:
                  - id
                  - number
                  - label
                  - impact
                additionalProperties: false
            answer_hint:
              type: string
            custom_allowed:
              type: boolean
          required:
            - id
            - sequence
            - question
            - why_asked
            - selection_mode
            - recommended_option_id
            - recommendation_reason
            - options
            - answer_hint
            - custom_allowed
          allOf:
            - if:
                properties:
                  selection_mode:
                    const: single
                required:
                  - selection_mode
              then:
                properties:
                  options:
                    maxItems: 4
            - if:
                properties:
                  selection_mode:
                    const: multiple
                required:
                  - selection_mode
              then:
                properties:
                  options:
                    maxItems: 8
          additionalProperties: false
        - type: "null"
    recommendation_register:
      type: object
      description: "推荐的逐项状态；proposed 不能成为写入依据。"
      properties:
        accepted:
          type: array
          items:
            $ref: "#/definitions/recommendation_record"
        revised:
          type: array
          items:
            $ref: "#/definitions/recommendation_record"
        rejected:
          type: array
          items:
            $ref: "#/definitions/recommendation_record"
        proposed:
          type: array
          items:
            $ref: "#/definitions/recommendation_record"
      required:
        - accepted
        - revised
        - rejected
        - proposed
      additionalProperties: false
    application_plan:
      type: array
      description: "已确认或待确认的独立应用边界和路径。"
      items:
        type: object
        properties:
          id:
            type: string
          side:
            type: string
            enum:
              - frontend
              - backend
          name:
            type: string
          path:
            type: string
          role:
            type: string
          application_type:
            type: string
            enum:
              - backend-monolith
              - backend-application
              - api-gateway
              - bff
              - background-worker
              - scheduled-job
              - data-sync
          responsibility:
            type: string
            minLength: 1
          terminal:
            type: string
            minLength: 1
          runtime:
            type: string
          existing:
            type: boolean
          specifications:
            type: array
            items:
              type: string
          source:
            type: string
        required:
          - id
          - side
          - name
          - path
          - existing
          - source
        allOf:
          - if:
              properties:
                side:
                  const: backend
              required:
                - side
            then:
              required:
                - application_type
                - role
          - if:
              properties:
                side:
                  const: frontend
              required:
                - side
            then:
              not:
                required:
                  - application_type
          - if:
              properties:
                application_type:
                  const: backend-monolith
              required: [application_type]
            then:
              properties:
                role:
                  const: "单体后端"
          - if:
              properties:
                application_type:
                  const: backend-application
              required: [application_type]
            then:
              required:
                - responsibility
              properties:
                role:
                  const: "独立后端应用"
          - if:
              properties:
                application_type:
                  const: api-gateway
              required: [application_type]
            then:
              properties:
                role:
                  const: "API 网关"
          - if:
              properties:
                application_type:
                  const: bff
              required: [application_type]
            then:
              required:
                - terminal
              properties:
                role:
                  const: "BFF"
          - if:
              properties:
                application_type:
                  const: background-worker
              required: [application_type]
            then:
              properties:
                role:
                  const: "后台任务"
          - if:
              properties:
                application_type:
                  const: scheduled-job
              required: [application_type]
            then:
              properties:
                role:
                  const: "定时任务"
          - if:
              properties:
                application_type:
                  const: data-sync
              required: [application_type]
            then:
              properties:
                role:
                  const: "数据同步"
          - if:
              properties:
                application_type:
                  const: data-sync
                existing:
                  const: false
              required: [application_type, existing]
            then:
              properties:
                name:
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*-data-sync(?:-job)?$"
                path:
                  pattern: "^development/backend/apps/[a-z0-9]+(?:-[a-z0-9]+)*-data-sync(?:-job)?$"
        additionalProperties: false
    scaffold_plan:
      type: array
      description: "逐应用代码骨架决定、生成命令和验证入口；未确认应用不得生成。"
      items:
        type: object
        properties:
          application_id:
            type: string
          generate:
            oneOf:
              - type: boolean
              - type: "null"
          status:
            type: string
            enum:
              - proposed
              - confirmed
              - generated
              - skipped
              - blocked
          runtime:
            type: string
          framework:
            type: string
          commands:
            type: array
            items:
              type: string
          start_command:
            oneOf:
              - type: string
              - type: "null"
          test_command:
            oneOf:
              - type: string
              - type: "null"
        required:
          - application_id
          - generate
          - status
          - commands
          - start_command
          - test_command
        additionalProperties: false
    structure_profile:
      description: "本次采用的结构策略；audit 或尚未选择时为 null。"
      oneOf:
        - type: string
          enum:
            - zx-full-delivery
            - adaptive
            - custom
        - type: "null"
    structure_assessment:
      type: array
      description: "合理结构、重复边界、错放内容、过度设计和风险。"
      items:
        type: string
    fact_register:
      type: object
      description: "事实登记；每项都保留事实来源或推断依据。"
      properties:
        confirmed:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
            required:
              - fact
              - source
            additionalProperties: false
        proposed:
          type: array
          description: "AI 提出但用户尚未明确确认的候选事实；不能成为创建依据。"
          items:
            type: object
            properties:
              id:
                type: string
              fact:
                type: string
              source:
                type: string
            required:
              - id
              - fact
              - source
            additionalProperties: false
        inferred:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
            required:
              - fact
              - source
            additionalProperties: false
        unknown:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
                description: "说明缺少哪个事实来源。"
            required:
              - fact
              - source
            additionalProperties: false
      required:
        - confirmed
        - proposed
        - inferred
        - unknown
      additionalProperties: false
    proposed_structure:
      type: string
      description: "适配当前项目的推荐目录树；不需要调整时说明保留现状。"
    structure_comparison:
      type: object
      description: "用户/方案要求与实际提案的逐项路径差异；确认前必须可核对。"
      properties:
        requested_paths:
          type: array
          items:
            type: string
        planned_paths:
          type: array
          items:
            type: string
        missing_paths:
          type: array
          items:
            type: string
        additional_paths:
          type: array
          items:
            type: string
        renamed_or_moved:
          type: array
          items:
            type: object
            properties:
              requested:
                type: string
              planned:
                type: string
              reason:
                type: string
            required:
              - requested
              - planned
              - reason
            additionalProperties: false
        exact_match:
          type: boolean
      required:
        - requested_paths
        - planned_paths
        - missing_paths
        - additional_paths
        - renamed_or_moved
        - exact_match
      additionalProperties: false
    placement_rules:
      type: array
      description: "常见产物的唯一推荐位置与边界。"
      items:
        type: string
    creation_plan:
      type: array
      description: "确认前可完整审阅的执行清单；文件项必须包含最终完整内容和 SHA-256。"
      items:
        type: object
        properties:
          path:
            type: string
            description: "相对于 project_root 的路径；Git 初始化使用点号。"
          kind:
            type: string
            enum:
              - directory
              - file
              - git-init
          operation:
            type: string
            enum:
              - create
              - update
              - move
          content:
            type: string
            description: "kind=file 时的最终完整文件内容，不得只给摘要或省略号。"
          content_sha256:
            type: string
            pattern: "^[a-f0-9]{64}$"
          reason:
            type: string
        required:
          - path
          - kind
          - operation
          - reason
        additionalProperties: false
        allOf:
          - if:
              properties:
                kind:
                  const: file
              required:
                - kind
            then:
              required:
                - content
                - content_sha256
    migration_map:
      type: array
      description: "逐项列出的原路径、新路径、理由、影响与处置状态。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
          reason:
            type: string
          impact:
            type: string
          status:
            type: string
            enum:
              - proposed
              - moved
              - unchanged
              - needs-confirmation
        required:
          - source
          - target
          - reason
          - impact
          - status
        additionalProperties: false
    authority_map:
      type: array
      description: "主题、当前权威文件、历史位置与冲突处理规则。"
      items:
        type: string
    context_policy:
      type: array
      description: "AI 默认读取、按需读取、默认不读取和忽略内容的规则。"
      items:
        type: string
    changes:
      type: array
      description: "本次实际创建、移动、修改或删除的内容；propose/audit/blocked 时为空。"
      items:
        type: string
    validation:
      type: array
      description: "实际执行的结构、引用、构建、测试和版本库验证及结果。"
      items:
        type: string
    follow_ups:
      type: array
      description: "仍需用户确认、无法可靠归类或受阻的事项；不得包含提案操作文案、确认指令或 1/2/3 动作。"
      items:
        type: string
    proposal_actions:
      type: array
      description: "提案数字操作的唯一输出字段；只在 awaiting-confirmation 或 migration-proposed 时包含完整 1/2/3，其他结果为空数组。用户可见渲染必须将本字段作为最后一段，不得依赖对象键顺序。"
      maxItems: 3
      uniqueItems: true
      prefixItems:
        - type: object
          properties:
            number:
              const: 1
            action:
              const: confirm-current-proposal
            label:
              const: "确认当前 proposal_id"
          required: [number, action, label]
          additionalProperties: false
        - type: object
          properties:
            number:
              const: 2
            action:
              const: revise-current-proposal
            label:
              const: "返回修改"
          required: [number, action, label]
          additionalProperties: false
        - type: object
          properties:
            number:
              const: 3
            action:
              const: abandon-current-proposal
            label:
              const: "放弃"
          required: [number, action, label]
          additionalProperties: false
      items:
        oneOf:
          - type: object
            properties:
              number:
                const: 1
              action:
                const: confirm-current-proposal
              label:
                const: "确认当前 proposal_id"
            required: [number, action, label]
            additionalProperties: false
          - type: object
            properties:
              number:
                const: 2
              action:
                const: revise-current-proposal
              label:
                const: "返回修改"
            required: [number, action, label]
            additionalProperties: false
          - type: object
            properties:
              number:
                const: 3
              action:
                const: abandon-current-proposal
              label:
                const: "放弃"
            required: [number, action, label]
            additionalProperties: false
  required:
    - result
    - proposal_id
    - proposal_payload
    - summary
    - workflow_mode
    - guided_question
    - recommendation_register
    - application_plan
    - scaffold_plan
    - structure_profile
    - structure_assessment
    - fact_register
    - proposed_structure
    - structure_comparison
    - placement_rules
    - creation_plan
    - migration_map
    - authority_map
    - context_policy
    - changes
    - validation
    - follow_ups
    - proposal_actions
  allOf:
    - if:
        properties:
          result:
            enum:
              - awaiting-confirmation
              - migration-proposed
        required: [result]
      then:
        properties:
          proposal_actions:
            minItems: 3
            maxItems: 3
    - if:
        properties:
          result:
            not:
              enum:
                - awaiting-confirmation
                - migration-proposed
        required: [result]
      then:
        properties:
          proposal_actions:
            maxItems: 0
  additionalProperties: false
  definitions:
    recommendation_record:
      type: object
      properties:
        question_id:
          type: string
        option:
          type: string
        reason:
          type: string
        source:
          type: string
      required:
        - question_id
        - option
        - reason
        - source
      additionalProperties: false

constraints:
  - "仅处理 project_root 及用户明确授权的项目范围，保留范围外文件和外部状态。"
  - "propose 和 audit 永远只读；不能在输出提案的同一轮创建、移动、修改、删除文件或初始化 Git。"
  - "apply 必须携带原始 approved_proposal、confirmed=true，且两个 proposal_id 与原始载荷重新计算值完全一致，否则返回 blocked。"
  - "initialize_git 默认为 false；只有 initialize_git=true 被写入已确认提案时才允许初始化 Git。"
  - "事实登记中的 confirmed、inferred、unknown 每项必须包含 fact 和 source。"
  - "initialize 未选择 structure_profile 且未提供完整 requested_structure 时必须返回 needs-input，不得默认采用轻量或完整模板。"
  - "局部确认只更新用户明确提及的事实；未明确提及的候选事实必须保留为 proposed，不得自动转为 confirmed。"
  - "必须读取 references/guided-project-workflows.yaml；一次只提出一个问题，每个关键问题给出推荐选项、理由和影响。"
  - "推荐选项只属于 proposed；用户未明确 accept、revise 或自定义时，推荐不等于确认，不能成为写入依据。"
  - "当前 guided_question 的推荐必须同时登记到 recommendation_register.proposed；事实不足时推荐安全的澄清选项。"
  - "前后端应用分别位于 development/frontend/apps 和 development/backend/apps；不得创建 services、packages、libs 或 shared-code。"
  - "每个应用都是独立项目，不直接引用其他应用源码；接口规范跟随提供方应用。"
  - "后端应用语义必须区分 backend-monolith、API Gateway 和 BFF；禁止使用“单一后端 API”代表单体。backend-application 必须另行记录非空 responsibility，BFF 必须另行记录非空 terminal，两者都不得塞入 canonical role。"
  - "代码骨架先询问批量策略；已有应用不得重新生成代码骨架。"
  - "同一 guided_question 的 option number 必须唯一并按 1..N 连续；sequence 从 1 开始，并在同一任务的后续轮次严格递增；数字答复只映射最新且唯一未解决问题，无法唯一定位时返回 needs-input。同时存在多个仍可识别的提案时，纯数字 1 不得选择任一提案或写入。"
  - "structure_profile=custom 时用户目录树是权威结构；禁止静默改名、搬移、增加或遗漏路径。"
  - "structure_profile=zx-full-delivery 时必须逐项采用 references/zx-full-delivery-structure.yaml，不得改造成 src 或其他轻量结构。"
  - "决定稳定代码边界、文档分类或编号的关键信息未知时返回 needs-input，不套用默认模板。"
  - "空工作区只证明尚未落盘，不证明项目类型、代码边界、文档分类或技术决策尚未确认。"
  - "用户确认的长期职责边界即使当前为空也应进入提案；AI 推断或未来可能需要的模块不能成为创建依据。"
  - "reorganize 必须先提交完整迁移映射；只执行与确认提案完全一致的 approved_migration_map。"
  - "移动、覆盖、归档或删除有未提交修改的文件前必须明确报告影响；不擅自 stash、还原或丢弃用户修改。"
  - "不覆盖同名目标；存在冲突、用途不明或确认不匹配时停止并返回 blocked 或 needs-input。"
  - "优先服从框架、构建、部署和既有稳定工程约定，不为统一外观强制套用固定目录模板。"
  - "按产物用途、成熟度和权威性分类，不按创建者、AI 工具或文件格式作为首要分类。"
  - "不因未来可能需要而预建微服务、消息队列、部署、迁移、集成、归档等推测性模块。"
  - "当前权威资料与历史资料必须分离；归档、日志、构建产物和原始测试输出默认不作为当前事实来源。"
  - "AGENTS.md 只保存短小、长期有效且可执行的规则，不写入过程流水账、完整历史或大段项目知识。"
  - "物理删除必须有精确目标和用户明确授权；仅有提案确认不等于删除授权。"

prompt: |-
  你正在执行“ZX 项目结构整理”。目标是在不破坏用户现有工作的前提下，为 AI 驱动项目建立清晰、
  可扩展且上下文友好的目录与文件规则，并安全处理老项目重构。

  开始前必须读取同目录 `references/guided-project-workflows.yaml`。该文件定义 workflow_mode、逐问逐答、
  推荐生命周期、应用命名、接口归属和代码骨架门禁；不得只凭本 prompt 中的摘要重新发明这些规则。

  这是严格的“提案—确认—执行”协议：
  - action=propose：只读检查并输出完整提案，result 为 needs-input、awaiting-confirmation、audited
    或 migration-proposed；changes 必须为空。同一轮不得继续写入。
  - action=apply：读取 approved_proposal.canonical_payload 并重新计算 proposal_id；不得重新生成或润色
    已确认的目录、文件内容和迁移映射。只有 confirmation.confirmed=true、confirmation.proposal_id、
    approved_proposal.proposal_id 与重新计算值全部一致时才能继续。缺少确认或确认不匹配立即返回 blocked，
    changes 为空。
  - audit 只接受 propose；任何 apply 请求都返回 blocked。
  - project_root 可在引导开始时缺失，但在生成任何可执行提案或执行 apply 前必须询问并确认用户授权的项目根目录。

  proposal_id 必须绑定提案内容。构造 proposal_payload，字段固定为 mode、workflow_mode、解析后的 project_root、
  project_facts、recommendation_register、structure_profile、fact_register.confirmed、application_plan、
  scaffold_plan、proposed_structure、structure_comparison、creation_plan、migration_map、initialize_git；将对象按键名
  递归升序、数组保持展示顺序、UTF-8 且无多余空白序列化为 canonical JSON，计算 SHA-256，取前 16 位
  小写十六进制并添加 zpo- 前缀。propose 必须把这段 canonical JSON 原文返回为 proposal_payload；
  无可执行提案时 proposal_payload 为 null。仓库脚本可用时优先用
  `scripts/compute-proposal-id.py --prefix zpo-` 计算；手工实现时哈希输入必须是无末尾换行的 canonical
  JSON UTF-8 字节，不得把 shell 管道附加的换行计入哈希。禁止在提案内容中加入时间、随机数等不稳定值。

  apply 的执行计划只能来自 approved_proposal.canonical_payload。解析后先验证 schema、project_root、mode、
  路径仍在授权范围且内容哈希正确，再重新计算 proposal_id；不得重新生成 proposal_payload，不得根据当前
  偏好增删目录或改写完整文件内容。然后重新检查文件系统、Git 状态、目标冲突和关键 confirmed 事实：
  若原计划已不安全或事实发生变化，返回 blocked 并生成一份新的只读提案供用户重新确认；不要执行旧计划。

  先建立项目事实登记，再设计目录：
  - confirmed：只收录用户当前明确说明、confirmed_facts、权威文件或工作区可验证事实，每项保留 source。
  - proposed：收录 AI 在上一轮提出、等待用户逐项决定的候选事实，每项给稳定 id；不能成为创建依据。
  - inferred：记录从名称、惯例或现状做出的推断及依据；只能解释建议，不能成为创建依据。
  - unknown：记录会改变目录方案但缺少的事实，并在 source 说明缺少哪类证据。
  - 用户引用先前任务或决策且当前可读取时先读取；无法读取时请求提供已确认结论，不得用空工作区覆盖历史事实。

  处理用户对事实清单的回复时执行局部确认：
  - 将本轮表达精确映射到 pending_fact_proposals 的 fact id；只有 fact_updates 明确列出的 id 才能更新。
  - decision=confirm 才转入 confirmed；decision=reject 从候选中排除；decision=revise 只用 revised_fact 替换该项。
  - 用户未明确提及的候选事实继续保留在 proposed。局部确认不能被解释为“其余全部确认”，不得用
    “用户承接上一轮事实清单并仅修正部分内容”作为未提及事项的 confirmed 来源。
  - “可以创建代码文件夹”只确认需要代码边界，不确认目录名或内部模块。不得把 development 改为 src，
    也不得自行推出 frontend、backend、experiments；这些路径必须来自所选 profile 或用户完整自定义结构。

  执行引导式工作流：
  - workflow_mode=auto 时，先依据用户明确说明和只读工作区证据区分 new-project 与 existing-project；证据冲突或
    不足时返回 needs-input，只询问工作流类型。空目录不能推翻用户对存量项目的明确说明。
  - 项目用途、目标用户和阶段不阻塞目录提案；用户未主动提供时不得询问或猜测。
  - 问题顺序从项目位置与标识开始，只询问会改变路径、文件、代码生成、基础设施配置或 Git 状态的决定。
  - 每个 guided_question 显示“问题 <sequence>”，每个选项显示 number；单选可回复一个数字，多选可回复逗号分隔数字。
    单选 answer_hint 写为“回复数字即可，例如：1”。
  - 同一 guided_question 的 option number 必须唯一并按 1..N 连续；sequence 从 1 开始，并在同一任务的后续轮次严格递增。
    数字答复只映射最新且唯一未解决问题；无法唯一定位时返回 needs-input。
    本 Skill 是声明式 prompt-contract；上述跨轮规则必须由调用模型执行，并在新上下文中进行前向行为测试。
  - 每个关键问题必须给 2 至 4 个可理解选项；selection_mode=multiple 时可给 2 至 8 个选项，并提供一个推荐选项、
    推荐理由和各选项影响，且允许自定义。若信息不足以
    形成业务或技术推荐，事实不足时推荐安全的澄清选项，例如提供项目背景或授权只读扫描；不得返回无推荐，
    也不得用猜测填补缺失事实。
  - 推荐选项只属于 proposed。只有 recommendation_updates 中 decision=accept 的问题进入 accepted；revise 使用用户答案
    进入 revised；reject 进入 rejected。推荐不等于确认，未明确提及的推荐继续 proposed，不能进入 creation_plan。
    当前 guided_question 的推荐必须同时登记到 recommendation_register.proposed，question_id、option、reason 和 source
    与问题内容一致；下一轮处理用户决定后再移动到 accepted、revised 或 rejected。
  - 应用目录一次收集前端和后端清单，不拆成前端存在性、前端列表、后端存在性和后端列表四个固定问题。
    项目位置、display_name、project_slug 与结构策略必须确认；project_slug 可推荐但必须确认，不得未经确认把中文名称
    自动转为拼音。
  - applications 问题涉及后端时，必须以 backend-monolith（单体后端）、API Gateway（网关边界）和 BFF（面向特定
    前端的聚合层）的不歧义语义展示选择；Gateway/BFF 不等同业务单体。禁止使用“单一后端 API”代表单体。
    稳定类型还包括 backend-application（一般独立服务或微服务）、background-worker、scheduled-job 和 data-sync；
    每类 application_type 必须写入 reference 声明的唯一 canonical role 和路径语义。applications 问题按已确认
    上下文每轮最多 8 个相关选项，无需展示整个 catalog。任何后端 application_type 都不得用于推断技术语言。
  - existing-project 先只读扫描目录、源码、构建入口、Git 状态、文档、部署配置和路径引用；优先推荐沿用稳定约定或
    保持现状。随后逐项确认保留、移动、改名、新增和丢弃内容，不将扫描推断直接升级为确认事实。

  建立独立应用计划：
  - 前端容器固定为 development/frontend/apps，后端容器固定为 development/backend/apps；即使当前只有一个应用也
    保留 apps 层。不得创建 services、packages、libs 或 shared-code，不得让应用通过相对路径直接引用其他应用源码。
  - 前端名采用 `<project-slug>-<terminal>`。常用终端短名为 web-admin、h5、wx-mini、uniapp、ios、android；例如
    ai-huoke-wx-mini 和 ai-huoke-uniapp。运行时或框架名不进入目录名。
  - 单一后端应用允许 `<project-slug>` 或 `<project-slug>-api`；多个后端应用推荐
    `<project-slug>-<responsibility>`。现有裸名称不得自动重命名，Go、Python、Node.js 可并存于 backend/apps。
  - 用户选择 monolith 后，application_plan 必须明确记录 application_type=backend-monolith、role=单体后端；不能仅靠
    后端目录数量推断。单体是部署和业务边界，不是语言。技术栈未知且 scaffold_strategy=all-skip 时，
    不得询问或推断 Go、Python、Node.js，也不得把 monolith 自动绑定到任何运行时。
  - HTTP API、RPC、消息接口规范跟随提供方应用，按需位于其 specifications/http-api、specifications/rpc 或
    specifications/messages。接口规范跟随提供方应用，不创建 development/backend/specifications 等中央规范目录。
  - backend-application 的 role 必须始终是 canonical role“独立后端应用”，具体业务职责单独放在非空 responsibility，并用于
    `<project-slug>-<responsibility>` 路径。BFF 的 role 必须始终是 canonical role“BFF”，服务终端单独放在非空 terminal，
    并用于 `<project-slug>-<terminal>-bff` 路径。不得把 responsibility 或 terminal 改写进 role。
  - data-sync 允许 `<project-slug>-data-sync` 和 `<project-slug>-data-sync-job` 两种清晰形式；两者都保持
    application_type=data-sync、role=数据同步，例如 `ai-huoke-data-sync-job`；不得据名称推断技术语言。
  - application_plan 必须为每个应用记录来源；名称、终端、职责或边界仍为 proposed/unknown 时不得生成该应用目录。

  代码骨架批量策略与安全门禁：
  - 代码骨架先询问批量策略；全部只创建目录时一次把所有新应用记为 generate=false、status=skipped。
  - all-generate 或 selective 仅使所选新应用进入代码骨架细节确认；只有用户对选中的应用明确选择 generate，且该应用
    所需的运行时、框架或标准库、关键版本、包管理或模块名、启动命令和测试命令均已确认，才能把生成命令和完整文件
    写入 scaffold_plan/creation_plan。
  - 对尚未决定的所选应用，status=proposed 时 generate 必须为 null；不得为了满足布尔字段把未决定状态伪装成 false。
  - selective 使用数字多选应用；未选应用只创建已确认的目录和基础文档，不生成代码。
  - 已有应用不得重新生成代码骨架，不得覆盖、静默升级或统一其技术栈。existing-project 只有用户明确新增的应用可以
    进入骨架询问；检测到目标文件已存在时返回 blocked 或改为迁移提案。
  - 代码骨架必须最小但可运行，生成计划列出完整文件、命令、start_command 和 test_command；apply 后实际运行相称的
    启动或测试验证。技术栈事实不足时返回 needs-input，不生成占位代码或猜测框架。

  基础设施与确认呈现：
  - 基础设施推荐暂不确认基础设施；不得根据 MVP、AI、用途或目标用户推荐数据库、缓存、消息队列或定时任务。
    用户未确认基础设施时不创建配置或目录。
  - awaiting-confirmation 或 migration-proposed 的用户答复必须直接展示 proposed_structure 的完整目录树；数量统计不能替代完整目录树。
    目录树使用 text 代码块，不得用“其余目录同模板”、省略号或摘要替代。
  - 面向用户的呈现顺序是独立渲染合同：完整目录树 → 完整 migration/creation map → 完整 planned file contents/commands →
    风险与校验 → 具体 proposal_id → proposal_actions 作为最后一段。完整 map 对 reorganize 渲染 migration_map，对 initialize
    渲染 creation_plan；文件项必须呈现完整 content，骨架项必须呈现完整 commands。这个顺序不得依赖 JSON/YAML object 的键顺序。
  - 提案动作文案只能出现在专用 proposal_actions 字段对应的最后一段；summary、follow_ups 和任何更早字段都不得提前包含。
    follow_ups 不得包含提案操作文案、确认指令或 1/2/3 动作。
  - 同时存在多个仍可识别的提案时，纯数字 `1` 必须返回 needs-input，proposal_actions 为空，不得选择任一提案，changes 为空且不得写入。

  initialize 必须先选择一种结构策略，且没有隐式默认值：
  - zx-full-delivery：读取同目录 `references/zx-full-delivery-structure.yaml`，把其中版本化的 39 个基础目录、
    4 个文件和 placement_rules 视为用户选择的完整结构。所有目录都是已确认的长期交付边界，即使为空也
    进入 creation_plan；只允许在 frontend/apps、backend/apps 下增加已确认应用及其提供方规范路径，不得借此添加
    其他未确认路径或 forbidden_default_paths。文件内容根据项目事实生成，但路径和必备章节固定。
  - adaptive：根据 confirmed 事实和现有工程约定生成最小结构；推断与 proposed 不能成为创建依据。
  - custom：解析 requested_structure 得到权威路径集合；保持大小写、数字前缀、中文名称、父子关系和根目录位置。
    不得把 `development` 改为 `src`，不得把根 `research` 搬到 `docs/research`，不得合并、补充或删减路径。
  - 用户没有选择 structure_profile 且没有提供可直接视为 custom 的完整目录树时，返回 needs-input，只问一次：
    “选择 zx-full-delivery、adaptive，或提供 custom 完整结构？” 不先生成任何可执行 creation_plan。

  结构提案前必须生成 structure_comparison：
  - requested_paths 来自 zx-full-delivery 参考文件、custom 目录树，或 adaptive 的已确认职责路径。
  - planned_paths 来自 creation_plan 中全部 directory/file 路径；统一移除展示用尾斜杠后比较。
  - missing_paths、additional_paths 和 renamed_or_moved 逐项列出差异，不用自然语言概括。
  - zx-full-delivery/custom 只有 missing_paths、additional_paths、renamed_or_moved 全为空时 exact_match=true，
    才允许返回 awaiting-confirmation；存在任何差异都返回 validation-failed 或 needs-input，不生成 proposal_id。

  目录创建判定：
  - 已确认且长期稳定的职责边界：纳入初始化提案，即使目前为空。
  - 已确认但由框架脚手架生成的结构：记录生成方式，不提前制造冲突。
  - 仅由 AI 推断的分类：保留在 inferred 和备选说明中，不进入 creation_plan。
  - 会改变一级目录、代码边界、稳定文档分类或编号的未知事项：返回 needs-input，不生成可执行提案。
  - 推测性技术模块、尚未发生的运维/集成/迁移能力：不创建。
  - 归档、日志和机器数据目录：仅在已有内容、工具约定或明确保留政策时创建。

  按 mode 处理：

  1. initialize
     - 采用 new-project 引导，用户主动提供的项目用途、目标用户和阶段作为可选背景保留；缺失时不得询问。
       只检查会影响提案的命名、代码形态、协作方式、根目录现状和适用约束，先输出 fact_register、
       recommendation_register、application_plan 和 scaffold_plan。
     - 先解析 structure_profile；再判断该策略真正需要的 facts 是否足够。zx-full-delivery 已确认完整职责边界，
       不得因为技术栈未定而删除 development/frontend、development/backend 或 development/experiments。
     - facts 足够且当前没有 guided_question 时生成 proposed_structure、structure_comparison、placement_rules、authority_map、context_policy
       和 creation_plan。
     - creation_plan 必须逐项列出目录和文件；每个 kind=file 项必须展示最终完整文件内容及其 content_sha256，
       不能用摘要、省略号或“稍后生成”代替。只有这样用户确认的才是最终会写入的内容。
     - initialize_git 默认为 false。只有输入明确 initialize_git=true 时才把 kind=git-init 纳入 creation_plan；
       没有纳入已确认计划时，apply 不得运行 git init。
     - propose 返回 awaiting-confirmation、proposal_payload 和可复制确认提示；不写入。apply 只执行确认提案逐项列出的操作，
       不增加“顺手创建”的目录或文件。成功后返回 initialized。

  2. audit
     - 采用 existing-project 引导，只读取现有事实，不询问或执行代码骨架生成。
     - 读取适用的 AGENTS.md、README、版本库状态、目录树、技术栈、构建测试配置和文档索引。
     - 识别运行边界、稳定约定、未提交修改、符号链接、生成物、路径引用和大体积资料。
     - 检查重复分类、编号断层、多份当前文档、历史与现行混放、日志提交、代码与文档错放等问题。
     - 区分外观差异与真实成本；已有结构可运行且边界清楚时明确建议不重构。
     - 返回 audited；proposal_id 和 proposal_payload 为 null、creation_plan 和 changes 为空，不做任何写入。

  3. reorganize
     - 采用 existing-project 引导；已有应用 scaffold_plan 必须为 generate=false、status=skipped。
     - propose 生成完整 migration_map，逐项说明路径、理由、影响和冲突风险，返回 migration-proposed；不移动文件。
     - apply 要求 approved_migration_map 与原始 proposal_payload 中的映射完全一致，并要求匹配 proposal_id。
       先复核版本库状态、目标冲突和未提交修改；任何使原计划不再安全的变化都返回 blocked，要求重新提案确认。
     - 只执行已确认映射；已跟踪文件优先保留历史。按非代码资料、文档与引用、代码与配置的小批次处理，
       每批后验证，失败即停止扩大影响并返回 validation-failed。
     - 更新受影响的 import、别名、Markdown 链接、脚本、环境示例、容器、CI、部署和测试夹具。

  文件归类顺序只适用于 adaptive 或用户未指定归属的新增产物：先判定源码/当前正式文档/原始调研/
  设计交付/测试证据/机器生成物/历史资料；
  再判断成熟度；最后选择现有位置。原始输入与整理结论分开，验收标准与验收记录分开，自动化测试
  跟随代码，业务测试文档进入文档区。只有形成长期独立职责且现有边界无法承载时才新增目录。

  上下文治理形成四层：常驻入口（短小 AGENTS.md、根 README、状态、索引）；当前资料（唯一权威文档）；
  历史资料（可检索但默认不读）；机器数据（默认忽略，仅诊断时读取局部）。为每个主题指定唯一权威入口；
  文档与代码冲突时报告冲突，不自行宣布一方正确。

  验证要求：所有结果只报告实际检查证据。apply 成功后核对实际变更与 creation_plan 或 migration_map
  一致；reorganize 至少检查版本库差异、路径引用和文档链接，涉及代码时运行相称的 lint、测试、构建或启动检查。
  输出前执行内部一致性检查：摘要中的应用数量必须从 application_plan 实际条目计算，不凭文字记忆手填；
  summary、fact_register、application_plan、scaffold_plan 和 proposed_structure 对应用名称、数量与状态的表述必须一致。
  最终严格按 output_schema 返回；每轮最多一个 guided_question；propose、audit、blocked 的 changes 必须为空。
  所有 recommendation_register.proposed 项都不得进入可执行计划。zx-full-delivery/custom 的
  完成验证必须明确报告 requested/planned 路径数量以及 missing/additional/renamed_or_moved 均为零。

