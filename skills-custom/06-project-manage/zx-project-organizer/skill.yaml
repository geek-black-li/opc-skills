schema_version: "1.0"
id: zx-project-organizer
name: "ZX 项目结构整理"
version: "3.0.0"
description: "当需要初始化项目工作区、审计或重构现有目录、归类文件、梳理权威文档，或治理 AI 上下文和历史资料时使用。先生成可核对提案，只有匹配提案的明确确认才能写入。"
category: 06-project-manage
origin: custom
status: active

triggers:
  intents:
    - "规划或创建新项目目录结构"
    - "审计现有项目的文件与目录"
    - "重新归类并重构老项目目录"
    - "判断需求、设计、Demo、调研或测试资料应放在哪里"
    - "制定 AGENTS.md、权威文档、归档和上下文读取规则"
  keywords:
    - zx-project-organizer
    - 项目结构
    - 工作区整理
    - 目录重构
    - 文件归类
    - AGENTS.md
    - 权威文档
    - 上下文治理
    - OPC独立开发

input_schema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - initialize
        - audit
        - reorganize
      description: "initialize 初始化新项目；audit 只读审计；reorganize 重构现有项目。"
    action:
      type: string
      enum:
        - propose
        - apply
      default: propose
      description: "propose 只生成提案；apply 仅在 confirmation 匹配当前提案时执行。audit 只接受 propose。"
    project_root:
      type: string
      description: "用户授权处理的项目根目录。"
    context:
      type: string
      description: "项目阶段、协作方式、代码组织、目标与已知约束。"
    artifacts:
      type: array
      description: "用户点名的文件、目录或需要判断归属的产物。"
      items:
        type: string
    requirements:
      type: array
      description: "必须保留的约定、目标结构、验收命令和其他要求。"
      items:
        type: string
    confirmed_facts:
      type: array
      description: "用户已确认、权威文件明确记录或当前工作区可验证的项目事实；不得放入 AI 推断。"
      items:
        type: object
        properties:
          fact:
            type: string
          source:
            type: string
            description: "事实来源，例如用户本轮说明、README 路径、决策记录或可验证配置。"
        required:
          - fact
          - source
        additionalProperties: false
    approved_migration_map:
      type: array
      description: "reorganize apply 时用户确认的原路径到新路径映射，必须与提案完全一致。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
        required:
          - source
          - target
        additionalProperties: false
    initialize_git:
      type: boolean
      default: false
      description: "是否把 Git 初始化纳入 initialize 提案；只有显式 true 且提案确认匹配时才允许执行。"
    approved_proposal:
      type: object
      description: "action=apply 时必填；必须原样传回 propose 输出的 proposal_id 和 canonical_payload。"
      properties:
        proposal_id:
          type: string
          pattern: "^zpo-[a-f0-9]{16}$"
        canonical_payload:
          type: string
          description: "propose 输出的 proposal_payload 原文，不得重新生成、重排或修改。"
      required:
        - proposal_id
        - canonical_payload
      additionalProperties: false
    confirmation:
      type: object
      description: "action=apply 时必填，必须确认当前提案的 proposal_id。"
      properties:
        confirmed:
          const: true
        proposal_id:
          type: string
          pattern: "^zpo-[a-f0-9]{16}$"
      required:
        - confirmed
        - proposal_id
      additionalProperties: false
  required:
    - mode
    - project_root
    - context
  additionalProperties: false

output_schema:
  type: object
  properties:
    result:
      type: string
      enum:
        - needs-input
        - awaiting-confirmation
        - audited
        - migration-proposed
        - initialized
        - reorganized
        - blocked
        - validation-failed
    proposal_id:
      description: "可执行提案的内容指纹；无需确认或无法成案时为 null。"
      oneOf:
        - type: string
          pattern: "^zpo-[a-f0-9]{16}$"
        - type: "null"
    proposal_payload:
      description: "用于复算 proposal_id 和执行的 canonical JSON 原文；无可执行提案时为 null。"
      oneOf:
        - type: string
        - type: "null"
    summary:
      type: string
      description: "当前模式、动作、结论与是否发生文件变更。"
    structure_assessment:
      type: array
      description: "合理结构、重复边界、错放内容、过度设计和风险。"
      items:
        type: string
    fact_register:
      type: object
      description: "事实登记；每项都保留事实来源或推断依据。"
      properties:
        confirmed:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
            required:
              - fact
              - source
            additionalProperties: false
        inferred:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
            required:
              - fact
              - source
            additionalProperties: false
        unknown:
          type: array
          items:
            type: object
            properties:
              fact:
                type: string
              source:
                type: string
                description: "说明缺少哪个事实来源。"
            required:
              - fact
              - source
            additionalProperties: false
      required:
        - confirmed
        - inferred
        - unknown
      additionalProperties: false
    proposed_structure:
      type: string
      description: "适配当前项目的推荐目录树；不需要调整时说明保留现状。"
    placement_rules:
      type: array
      description: "常见产物的唯一推荐位置与边界。"
      items:
        type: string
    creation_plan:
      type: array
      description: "确认前可完整审阅的执行清单；文件项必须包含最终完整内容和 SHA-256。"
      items:
        type: object
        properties:
          path:
            type: string
            description: "相对于 project_root 的路径；Git 初始化使用点号。"
          kind:
            type: string
            enum:
              - directory
              - file
              - git-init
          operation:
            type: string
            enum:
              - create
              - update
              - move
          content:
            type: string
            description: "kind=file 时的最终完整文件内容，不得只给摘要或省略号。"
          content_sha256:
            type: string
            pattern: "^[a-f0-9]{64}$"
          reason:
            type: string
        required:
          - path
          - kind
          - operation
          - reason
        additionalProperties: false
        allOf:
          - if:
              properties:
                kind:
                  const: file
              required:
                - kind
            then:
              required:
                - content
                - content_sha256
    migration_map:
      type: array
      description: "逐项列出的原路径、新路径、理由、影响与处置状态。"
      items:
        type: object
        properties:
          source:
            type: string
          target:
            type: string
          reason:
            type: string
          impact:
            type: string
          status:
            type: string
            enum:
              - proposed
              - moved
              - unchanged
              - needs-confirmation
        required:
          - source
          - target
          - reason
          - impact
          - status
        additionalProperties: false
    authority_map:
      type: array
      description: "主题、当前权威文件、历史位置与冲突处理规则。"
      items:
        type: string
    context_policy:
      type: array
      description: "AI 默认读取、按需读取、默认不读取和忽略内容的规则。"
      items:
        type: string
    changes:
      type: array
      description: "本次实际创建、移动、修改或删除的内容；propose/audit/blocked 时为空。"
      items:
        type: string
    validation:
      type: array
      description: "实际执行的结构、引用、构建、测试和版本库验证及结果。"
      items:
        type: string
    follow_ups:
      type: array
      description: "仍需用户确认、无法可靠归类或受阻的事项。"
      items:
        type: string
  required:
    - result
    - proposal_id
    - proposal_payload
    - summary
    - structure_assessment
    - fact_register
    - proposed_structure
    - placement_rules
    - creation_plan
    - migration_map
    - authority_map
    - context_policy
    - changes
    - validation
    - follow_ups
  additionalProperties: false

constraints:
  - "仅处理 project_root 及用户明确授权的项目范围，保留范围外文件和外部状态。"
  - "propose 和 audit 永远只读；不能在输出提案的同一轮创建、移动、修改、删除文件或初始化 Git。"
  - "apply 必须携带原始 approved_proposal、confirmed=true，且两个 proposal_id 与原始载荷重新计算值完全一致，否则返回 blocked。"
  - "initialize_git 默认为 false；只有 initialize_git=true 被写入已确认提案时才允许初始化 Git。"
  - "事实登记中的 confirmed、inferred、unknown 每项必须包含 fact 和 source。"
  - "决定稳定代码边界、文档分类或编号的关键信息未知时返回 needs-input，不套用默认模板。"
  - "空工作区只证明尚未落盘，不证明项目类型、代码边界、文档分类或技术决策尚未确认。"
  - "用户确认的长期职责边界即使当前为空也应进入提案；AI 推断或未来可能需要的模块不能成为创建依据。"
  - "reorganize 必须先提交完整迁移映射；只执行与确认提案完全一致的 approved_migration_map。"
  - "移动、覆盖、归档或删除有未提交修改的文件前必须明确报告影响；不擅自 stash、还原或丢弃用户修改。"
  - "不覆盖同名目标；存在冲突、用途不明或确认不匹配时停止并返回 blocked 或 needs-input。"
  - "优先服从框架、构建、部署和既有稳定工程约定，不为统一外观强制套用固定目录模板。"
  - "按产物用途、成熟度和权威性分类，不按创建者、AI 工具或文件格式作为首要分类。"
  - "不因未来可能需要而预建微服务、消息队列、部署、迁移、集成、归档等推测性模块。"
  - "当前权威资料与历史资料必须分离；归档、日志、构建产物和原始测试输出默认不作为当前事实来源。"
  - "AGENTS.md 只保存短小、长期有效且可执行的规则，不写入过程流水账、完整历史或大段项目知识。"
  - "物理删除必须有精确目标和用户明确授权；仅有提案确认不等于删除授权。"

prompt: |-
  你正在执行“ZX 项目结构整理”。目标是在不破坏用户现有工作的前提下，为 AI 驱动项目建立清晰、
  可扩展且上下文友好的目录与文件规则，并安全处理老项目重构。

  这是严格的“提案—确认—执行”协议：
  - action=propose：只读检查并输出完整提案，result 为 needs-input、awaiting-confirmation、audited
    或 migration-proposed；changes 必须为空。同一轮不得继续写入。
  - action=apply：读取 approved_proposal.canonical_payload 并重新计算 proposal_id；不得重新生成或润色
    已确认的目录、文件内容和迁移映射。只有 confirmation.confirmed=true、confirmation.proposal_id、
    approved_proposal.proposal_id 与重新计算值全部一致时才能继续。缺少确认或确认不匹配立即返回 blocked，
    changes 为空。
  - audit 只接受 propose；任何 apply 请求都返回 blocked。

  proposal_id 必须绑定提案内容。构造 proposal_payload，字段固定为 mode、解析后的 project_root、
  fact_register.confirmed、proposed_structure、creation_plan、migration_map、initialize_git；将对象按键名
  递归升序、数组保持展示顺序、UTF-8 且无多余空白序列化为 canonical JSON，计算 SHA-256，取前 16 位
  小写十六进制并添加 zpo- 前缀。propose 必须把这段 canonical JSON 原文返回为 proposal_payload；
  无可执行提案时 proposal_payload 为 null。仓库脚本可用时优先用
  `scripts/compute-proposal-id.py --prefix zpo-` 计算；手工实现时哈希输入必须是无末尾换行的 canonical
  JSON UTF-8 字节，不得把 shell 管道附加的换行计入哈希。禁止在提案内容中加入时间、随机数等不稳定值。

  apply 的执行计划只能来自 approved_proposal.canonical_payload。解析后先验证 schema、project_root、mode、
  路径仍在授权范围且内容哈希正确，再重新计算 proposal_id；不得重新生成 proposal_payload，不得根据当前
  偏好增删目录或改写完整文件内容。然后重新检查文件系统、Git 状态、目标冲突和关键 confirmed 事实：
  若原计划已不安全或事实发生变化，返回 blocked 并生成一份新的只读提案供用户重新确认；不要执行旧计划。

  先建立项目事实登记，再设计目录：
  - confirmed：只收录用户当前明确说明、confirmed_facts、权威文件或工作区可验证事实，每项保留 source。
  - inferred：记录从名称、惯例或现状做出的推断及依据；只能解释建议，不能成为创建依据。
  - unknown：记录会改变目录方案但缺少的事实，并在 source 说明缺少哪类证据。
  - 用户引用先前任务或决策且当前可读取时先读取；无法读取时请求提供已确认结论，不得用空工作区覆盖历史事实。

  目录创建判定：
  - 已确认且长期稳定的职责边界：纳入初始化提案，即使目前为空。
  - 已确认但由框架脚手架生成的结构：记录生成方式，不提前制造冲突。
  - 仅由 AI 推断的分类：保留在 inferred 和备选说明中，不进入 creation_plan。
  - 会改变一级目录、代码边界、稳定文档分类或编号的未知事项：返回 needs-input，不生成可执行提案。
  - 推测性技术模块、尚未发生的运维/集成/迁移能力：不创建。
  - 归档、日志和机器数据目录：仅在已有内容、工具约定或明确保留政策时创建。

  按 mode 处理：

  1. initialize
     - 检查项目目标、代码形态、协作方式、根目录现状和适用约束，先输出 fact_register。
     - facts 足够时生成 proposed_structure、placement_rules、authority_map、context_policy 和 creation_plan。
     - creation_plan 必须逐项列出目录和文件；每个 kind=file 项必须展示最终完整文件内容及其 content_sha256，
       不能用摘要、省略号或“稍后生成”代替。只有这样用户确认的才是最终会写入的内容。
     - initialize_git 默认为 false。只有输入明确 initialize_git=true 时才把 kind=git-init 纳入 creation_plan；
       没有纳入已确认计划时，apply 不得运行 git init。
     - propose 返回 awaiting-confirmation、proposal_payload 和可复制确认提示；不写入。apply 只执行确认提案逐项列出的操作，
       不增加“顺手创建”的目录或文件。成功后返回 initialized。

  2. audit
     - 读取适用的 AGENTS.md、README、版本库状态、目录树、技术栈、构建测试配置和文档索引。
     - 识别运行边界、稳定约定、未提交修改、符号链接、生成物、路径引用和大体积资料。
     - 检查重复分类、编号断层、多份当前文档、历史与现行混放、日志提交、代码与文档错放等问题。
     - 区分外观差异与真实成本；已有结构可运行且边界清楚时明确建议不重构。
     - 返回 audited；proposal_id 和 proposal_payload 为 null、creation_plan 和 changes 为空，不做任何写入。

  3. reorganize
     - propose 生成完整 migration_map，逐项说明路径、理由、影响和冲突风险，返回 migration-proposed；不移动文件。
     - apply 要求 approved_migration_map 与原始 proposal_payload 中的映射完全一致，并要求匹配 proposal_id。
       先复核版本库状态、目标冲突和未提交修改；任何使原计划不再安全的变化都返回 blocked，要求重新提案确认。
     - 只执行已确认映射；已跟踪文件优先保留历史。按非代码资料、文档与引用、代码与配置的小批次处理，
       每批后验证，失败即停止扩大影响并返回 validation-failed。
     - 更新受影响的 import、别名、Markdown 链接、脚本、环境示例、容器、CI、部署和测试夹具。

  文件归类顺序：先判定源码/当前正式文档/原始调研/设计交付/测试证据/机器生成物/历史资料；
  再判断成熟度；最后选择现有位置。原始输入与整理结论分开，验收标准与验收记录分开，自动化测试
  跟随代码，业务测试文档进入文档区。只有形成长期独立职责且现有边界无法承载时才新增目录。

  上下文治理形成四层：常驻入口（短小 AGENTS.md、根 README、状态、索引）；当前资料（唯一权威文档）；
  历史资料（可检索但默认不读）；机器数据（默认忽略，仅诊断时读取局部）。为每个主题指定唯一权威入口；
  文档与代码冲突时报告冲突，不自行宣布一方正确。

  验证要求：所有结果只报告实际检查证据。apply 成功后核对实际变更与 creation_plan 或 migration_map
  一致；reorganize 至少检查版本库差异、路径引用和文档链接，涉及代码时运行相称的 lint、测试、构建或启动检查。
  最终严格按 output_schema 返回；propose、audit、blocked 的 changes 必须为空。

