risk_assessment:
  overall: medium
  scope: 原生inspect及安装器禁止执行；其他脚本仅为候选，运行须另有任务授权。
  findings:
    - inspect.mjs第33至51行可能将cwd项目根目录作为静态服务根；仅有词法路径前缀检查，没有隐藏文件拒绝、realpath符号链接边界和访问认证。静态推断可请求根下.env或.git内容；符号链接可指向根外。虽绑定127.0.0.1仍不能把loopback等同安全证明。原生本地文件服务模式禁止执行。
    - inspect.mjs会删除输出目录中匹配命名的旧截图，写入report.json并启动Chrome；--out可指定路径。候选运行必须约束输出在授权项目，且不得清理用户已有截图；本次不执行。
    - scripts/lib/cdp.mjs会spawn浏览器、创建临时profile、开放调试端口并在正常关闭时递归移除临时profile。不是纯提示词；启动失败后的资源清理也未实测。
    - draw.mjs默认读写用户级~/.taste-skill/history.json并输出项目方向文件；候选使用时必须将TASTE_SKILL_HISTORY指向授权项目的.taste-skill/history.json，不能悄悄产生跨项目用户画像。
    - lint.mjs默认遍历当前目录，statSync跟随符号链接且未见循环检测；应只传入明确、已验证不越界的授权文件列表，不扫描任意目录树。
    - assets.mjs访问Openverse、Wikimedia、博物馆及视频库并下载文件、写来源许可记录；查询会发送给第三方，不能包含客户私有资料、密钥、未公开业务或本地文件。下载与素材许可须按实际任务授权和逐项核验。
    - 新版有至少4张真实图片和至少8个动态元素等硬偏好；不是通用产品质量门禁。既有品牌、用户要求和无障碍优先，无法满足原件门禁时如实披露，不伪造检查通过；若需系统性改变这些规则应走custom改造。
    - 根install.sh支持删除重建旧链接；不运行它，不安装整仓库兄弟Skill，不修改现有全局安装。
    - 全部75份UTF-8文本已模式扫描；重点检查主Skill、draw、lint、assets、inspect、CDP和安装器。14份图片等非文本不在目标Skill的可执行范围；未执行任何第三方代码，不证明运行时安全。
  compatibility:
    - 原样保留完整来源，正式external入口只加载skills/taste-skill及其最少必要资源；不会自动加载兄弟Skill。
    - 指令阅读及library查询可离线进行；draw和lint需按范围授权后才运行，assets联网另需许可；inspect一律禁用，用当前已有浏览器能力检查并明确原生gate未运行。
    - 建议更新现有external入口至1.1.0并保留旧source目录和提交记录；全局Codex副本仍保持旧版，是否同步另按明确范围执行。
