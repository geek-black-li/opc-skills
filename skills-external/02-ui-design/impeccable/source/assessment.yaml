    - crates/context/src/telemetry.rs默认允许抽选及选择反馈遥测，支持DO_NOT_TRACK和IMPECCABLE_NO_TELEMETRY退出；关闭遥测仍不等于离线，roll功能仍会请求API。首期禁止执行整个运行时，不能只调用telemetry off后宣称无网络。
    - .codex/hooks.json及plugin/hooks/hooks.json包含PostToolUse和Stop命令；安装器和hooks管理会修改工具配置。用户要求暂不启用，禁止复制或注册任何hooks、插件配置和后台任务。
    - live系统有本地服务、token、浏览器交互及源码写回能力；本轮不启用，也未验证全部路由、CSRF、路径解析和写回安全性。
    - 原件会读取或创建PRODUCT.md、DESIGN.md及.impeccable状态；OPCSkills已有PRD和UI规范，必须优先引用现有权威入口，不自动生成第二套冲突文档或重置设计规范。
    - reference/new-work.md含图像工具、子代理、生成图、废弃素材删除和设计文档写入流程；评估和普通打磨请求不构成这些操作的授权。
    - 3951份UTF-8文本已做模式扫描，重点人工核对Skill入口、launcher、CLI入口、遥测、hook配置和live服务；33份图片等非文本及大型生成JS未完成可执行行为证明，禁止因扫描无告警声称无后门。
