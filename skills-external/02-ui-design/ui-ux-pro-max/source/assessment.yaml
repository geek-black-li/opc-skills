risk_assessment:
  overall: medium
  findings:
    - >-
      目标 70 文件 Skill 的非测试运行时代码只使用 Python 标准库和本地 CSV/JSON；静态扫描未发现
      网络请求、凭据读取、shell/子进程、动态 eval/exec、权限提升、持久化或遥测。
    - >-
      design_system.py 仅在显式 --persist 时写入用户指定 output-dir；默认不覆盖已有 MASTER.md，
      只有显式 --force 才通过临时文件和 os.replace 覆盖。
    - >-
      目标 Skill 自带测试会启动本地 Python 子进程并在临时目录写文件，但不会在 Skill 加载时自动运行。
    - >-
      完整仓库 CLI 会访问 GitHub API/Release，可读取命令行 token、UI_PRO_MAX_GITHUB_TOKEN 或
      GITHUB_TOKEN，并把下载内容写入磁盘；这些行为只在显式调用 CLI 时发生。
    - >-
      CLI update 可通过 execFileSync 执行 npm install -g，init --force 可覆盖已安装文件，
      uninstall 可递归删除计算出的 Skill 目录；未发现 preinstall/postinstall 生命周期钩子，
      prepublishOnly 只在发布 CLI 时运行。
    - >-
      完整仓库还包含六个兄弟 Skill；其中部分脚本可读取 GEMINI_API_KEY/GOOGLE_API_KEY、访问外部 API
      或调用 shadcn 子进程。它们不属于本次 ui-ux-pro-max 目标子目录，也不应被适配入口默认执行。
    - >-
      发现 54 个 TTF 和 7 个 PNG 二进制资源，类型与声明用途相符但无法通过纯文本审计证明其内容安全；
      目标 ui-ux-pro-max 子目录本身不包含这些字体或 PNG。
    - "未发现私钥、常见云凭据或长令牌特征，也未发现混淆或编码执行载荷。"
    - >-
      版本元数据不一致：Git 标签和发布为 v2.15.0，但根 skill.json 声明 2.13.0，cli/package.json
      声明 2.5.0；正式适配必须以锁定标签和提交为准，并保留这一上游问题。
  compatibility:
    - >-
      原件是 Markdown frontmatter Skill，不符合 OPCSkills portable-yaml-skill 契约；原样入库需要生成
      origin=external 的最小 skill.yaml 适配入口，并把完整原件保存在 source/。
    - >-
      原始 .claude Skill 使用 ${CLAUDE_PLUGIN_ROOT}/.claude/... 路径，不能直接作为当前 Codex
      安装文件使用；Codex 版本需要根据上游 codex.json 生成或改写脚本路径。
    - >-
      上游 Codex 模板目标是 ~/.agents/skills/ui-ux-pro-max，而当前本机安装位于
      ~/.codex/skills/ui-ux-pro-max；直接运行官方全局更新器会产生第二份安装，而不是更新现有目录。
    - >-
      OPCSkills 正式 id 可使用 ui-ux-pro-max：不占用 zx- 个人命名空间，且当前 manifest 扫描范围内无重名。
    - "核心 Python 运行时声明无第三方依赖，适配后可在当前 Python 3 环境运行。"
  license: "MIT；允许保存、使用、修改和再分发，但必须保留版权与许可文本。"
  recommendation: >-
    建议确认原样入库到 02-ui-design：保留 v2.15.0 完整来源和哈希，仅为 OPCSkills 生成最小 external
    适配入口，并限制默认能力到 70 文件 ui-ux-pro-max 子目录。Codex 当前安装的更新应采用备份后原位替换，
    同时生成适用于 ~/.codex/skills 的脚本路径；不要直接运行上游 CLI，以免额外安装兄弟 Skill、全局 npm 包
    或在 ~/.agents/skills 形成重复版本。

